.gauge .zone{position:absolute;top:0;bottom:0;background:var(--vert);opacity:.85}
.gauge .needle{position:absolute;top:-8px;bottom:-8px;width:4px;margin-left:-2px;background:var(--orange);border:1px solid var(--encre)}
.vg{position:relative;width:70px;height:72%;background:var(--encre);border:2px solid #000}
.vg .z{position:absolute;left:0;right:0;background:rgba(75,227,138,.25);border-top:2px dashed var(--vert);border-bottom:2px dashed var(--vert)}
.vg .lvl{position:absolute;left:4px;right:4px;bottom:0;background:var(--orange)}
.vg .dz{position:absolute;left:0;right:0;background:rgba(224,48,42,.35)}
.simon{display:grid;grid-template-columns:repeat(2,110px);gap:14px}
.simon button{height:110px;border:2px solid var(--encre);border-radius:6px;opacity:.35;box-shadow:inset 3px 3px 0 rgba(255,255,255,.3),inset -4px -4px 0 rgba(0,0,0,.35);transition:opacity .08s}
.simon button.on{opacity:1}
.dials{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:88%}
.dial{background:var(--glace-s);border:2px solid var(--encre);padding:10px 6px;box-shadow:inset 0 3px 0 #A9CAD8}
.dial .lab{color:var(--txt-2);display:block;margin-bottom:6px}
.dial .v{font-family:var(--f-chiffre);font-size:40px;background:var(--encre);color:var(--glace);display:block;padding:2px 0}
.dial button{width:100%;border:0;background:none;padding:0}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:92%}
.lc{aspect-ratio:3/4;border:2px solid var(--encre);background:var(--acier-c);box-shadow:inset 2px 2px 0 var(--acier-l),inset -2px -3px 0 #151C21;display:flex;align-items:center;justify-content:center;padding:0}
.lc svg{width:60%;height:80%;opacity:0}
.lc.up,.lc.done{background:#16222A}.lc.up svg,.lc.done svg{opacity:1}.lc.done{opacity:.55}
.lc .q{font-family:var(--f-label);font-size:18px;color:var(--acier-l)}.lc.up .q,.lc.done .q{display:none}
.code{font-family:var(--f-chiffre);font-size:52px;letter-spacing:8px;background:var(--encre);color:var(--glace);padding:6px 14px}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:9px}
.keys button{height:54px;border:1.5px solid var(--encre);background:var(--acier-c);font-family:var(--f-chiffre);font-size:24px;box-shadow:inset 1.5px 1.5px 0 var(--acier-l),inset -2px -2px 0 #151C21,2px 2px 0 var(--encre)}
.keys button:active{transform:translate(1px,1px)}
.pots{display:grid;grid-template-columns:repeat(3,92px);gap:12px}
.pot{height:92px;border:2px solid var(--encre);background:#16222A;position:relative;padding:0}
.pot svg{width:70%;height:70%}
.pot .w{position:absolute;left:4px;right:4px;bottom:4px;height:5px;background:#000}
.pot .w>div{height:100%;background:var(--glace);width:0}
.scope{position:relative;width:88%;height:120px;background:var(--encre);border:2px solid #000;overflow:hidden}
.scope .tg{position:absolute;top:0;bottom:0;width:22px;margin-left:-11px;background:rgba(75,227,138,.25);border-left:2px solid var(--vert);border-right:2px solid var(--vert)}
.scope .nd{position:absolute;top:10px;bottom:10px;width:4px;margin-left:-2px;background:var(--orange)}
.knob{width:88%;accent-color:var(--orange);height:40px}
.hold{width:88%;height:8px;background:var(--encre)}.hold>div{height:100%;width:0;background:var(--vert)}
.fcard{width:150px;height:190px;border:2px solid var(--encre);display:flex;align-items:center;justify-content:center;transition:transform .2s;position:relative}
.fcard svg{width:84%;height:84%}
.fbtns{display:flex;gap:12px}
.fuses{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:84%}
.fuse{height:52px;border:2px solid var(--encre);background:#16222A;display:flex;align-items:center;justify-content:center;padding:0}
.fuse svg{width:80%;height:70%}
.tanks{display:flex;gap:16px;align-items:flex-end}
.tank{border:2px solid var(--encre);background:#16222A;position:relative;padding:0;width:74px;overflow:hidden}
.tank .wa{position:absolute;left:0;right:0;bottom:0;background:var(--glace);opacity:.85;transition:height .35s}
.tank .gr{position:absolute;left:0;right:0;border-top:1px solid rgba(220,235,241,.25)}
.tank.sel{outline:3px solid var(--orange);outline-offset:2px}
.tank .nb{position:absolute;top:4px;left:0;right:0;font-family:var(--f-chiffre);font-size:18px;text-align:center;color:var(--txt);z-index:2}
.pc{position:absolute;inset:8px;background:#0A1A22;border:2px solid #000;display:flex;flex-direction:column;padding:10px;font-family:var(--f-chiffre);font-size:12px;color:#5EC5E6}
.pc .bt{margin-top:auto;align-self:center}
.pop{position:absolute;background:#D7DEE2;color:#1A2228;border:2px solid #000;box-shadow:4px 5px 0 rgba(0,0,0,.6);font-family:var(--f-corps);font-size:12px;z-index:5}
.pop .ph{background:#3E6378;color:#fff;font-family:var(--f-label);font-size:10px;padding:5px 26px 5px 7px;letter-spacing:.4px}
.pop .pb{padding:10px 8px 14px;line-height:1.35;min-height:46px}
.pop.glitch .ph{background:#4B137F}.pop.glitch .pb{color:#4B137F;font-family:var(--f-chiffre)}
.pop .x{position:absolute;border:1.5px solid #000;background:#B8C2C9;color:#000;font-size:11px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;font-family:var(--f-label)}
.pop .fake{display:inline-block;margin-top:6px;border:1.5px solid #000;background:#B8C2C9;padding:2px 10px;font-family:var(--f-label);font-size:10px}
/* CTRL v2 : moniteur CRT + fenêtres rétro + corruption */

.pc{background:radial-gradient(ellipse at 50% 40%,#0E2E3C 0%,#071821 60%,#030B10 100%);border:1.5px solid #000;border-radius:6px;box-shadow:inset 0 0 30px rgba(0,0,0,.85),0 0 0 9px #11171B,0 0 0 10px #3A4852,0 0 0 11.5px #05080B,0 18px 30px rgba(0,0,0,.6),0 0 40px rgba(62,155,200,.18);color:#7FE0FF;text-shadow:0 0 6px rgba(95,212,232,.55);overflow:hidden;padding:12px 12px 10px}
.pc::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:9;border-radius:12px;background:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 1px,transparent 1px 3px),linear-gradient(135deg,rgba(255,255,255,.06) 0%,rgba(255,255,255,0) 35%)}
.pc .hd{display:flex;justify-content:space-between;align-items:center;margin:-2px -2px 8px;padding:4px 7px;background:rgba(95,212,232,.12);border:1px solid rgba(95,212,232,.35);font-size:11px;letter-spacing:.5px}
.pc .hd i{font-style:normal;color:#4BE38A}
.pc .cur{display:inline-block;width:7px;height:12px;background:#7FE0FF;vertical-align:-2px;margin-left:3px;animation:blink 1s steps(1) infinite}
.pc .bar{height:8px;border:1px solid rgba(95,212,232,.5);margin:6px 0 2px;padding:1px}.pc .bar>b{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#4BE38A 0 6px,transparent 6px 8px);transition:width .3s}
.pc .vein{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .4s}
.pop{background:#C9D3D9;border:2px solid #000;box-shadow:inset 2px 2px 0 #F2F6F8,inset -2px -2px 0 #7E8A94,5px 6px 0 rgba(0,0,0,.65);text-shadow:none;animation:popIn .18s cubic-bezier(.3,1.6,.5,1)}
@keyframes popIn{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.pop .ph{background:linear-gradient(90deg,#1E4A66,#3E7FA0);margin:2px 2px 0;padding:5px 28px 5px 24px;position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.pop .ph::before{content:"";position:absolute;left:6px;top:50%;width:12px;height:12px;margin-top:-6px;background:#F2D21E;clip-path:polygon(50% 0,100% 100%,0 100%);box-shadow:none}
.pop .pb{display:flex;gap:8px;align-items:flex-start;padding:10px 9px 14px}
.pop .pb .ic{flex:none;width:26px;height:26px;border:2px solid #000;border-radius:50%;background:#E0302A;color:#fff;font-family:var(--f-titre);font-weight:600;font-size:17px;line-height:22px;text-align:center;box-shadow:inset -2px -2px 0 #8A1A14,inset 2px 2px 0 #FF8A7A}
.pop .pb .ic.i{background:#3E7FA0;box-shadow:inset -2px -2px 0 #1E4A66,inset 2px 2px 0 #9CD8EE}
.pop .x{background:#C9D3D9;box-shadow:inset 1.5px 1.5px 0 #F2F6F8,inset -1.5px -1.5px 0 #7E8A94;font-weight:700}
.pop .fake{background:#C9D3D9;box-shadow:inset 1.5px 1.5px 0 #F2F6F8,inset -1.5px -1.5px 0 #7E8A94}
.pop.glitch{background:#1A0A2A;border-color:#8A2BE2;box-shadow:inset 0 0 18px rgba(138,43,226,.6),5px 6px 0 rgba(34,7,61,.8);animation:popIn .18s,gjit 1.6s steps(1) infinite}
.pop.glitch .ph{background:linear-gradient(90deg,#22073D,#8A2BE2);color:#F0DEFF}.pop.glitch .ph::before{background:#C98BFF}
.pop.glitch .pb{color:#C98BFF;text-shadow:2px 0 rgba(255,60,120,.6),-2px 0 rgba(60,200,255,.5)}
.pop.glitch .pb .ic{background:#4B137F;box-shadow:0 0 10px #C98BFF}
.pop.glitch .x{background:#4B137F;color:#F0DEFF;border-color:#C98BFF;box-shadow:none}
@keyframes gjit{0%,100%{transform:none}12%{transform:translate(2px,-1px) skewX(-3deg)}14%{transform:none}63%{transform:translate(-3px,1px)}65%{transform:none}}
/* === COUCHE BD FRANCO-BELGE === */
.phone:not(.nobd) .area svg [stroke="#05080B"],.phone:not(.nobd) .area svg [stroke="#000"]{stroke-width:3px;stroke-linejoin:round}
.phone:not(.nobd) .area{filter:url(#bdInk)}
.nobd .bd{display:none}
.bdt{margin-left:auto;border:1.5px solid var(--encre);background:var(--acier-c);color:var(--txt);font-family:var(--f-label);font-size:10px;letter-spacing:.4px;padding:5px 8px;box-shadow:inset 1.5px 1.5px 0 var(--acier-l),2px 2px 0 var(--encre)}
.bdt[aria-pressed="true"]{background:var(--orange);color:var(--encre);box-shadow:inset 1.5px 1.5px 0 var(--orange-c),2px 2px 0 var(--encre)}
.bd{position:absolute;inset:0;pointer-events:none;z-index:8}
.bd::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(5,8,11,.55) 0 1.3px,transparent 1.3px 6px),repeating-linear-gradient(-45deg,rgba(5,8,11,.35) 0 1px,transparent 1px 9px);-webkit-mask-image:radial-gradient(ellipse 75% 70% at 50% 45%,transparent 58%,#000 100%);mask-image:radial-gradient(ellipse 75% 70% at 50% 45%,transparent 58%,#000 100%)}
.bd::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(5,8,11,.22) 1px,transparent 1.5px) 0 0/5px 5px;mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(to bottom,transparent 55%,#000);mask-image:linear-gradient(to bottom,transparent 55%,#000);box-shadow:inset 0 0 0 4px #05080B}

<script>
/* ===== Moteur son Under Us (identique au banc son) ===== */
(function(){
let AC=null,MASTER=null,COMP=null,NOISE=null,AN=null;
function ctx(){
 if(AC)return AC;
 AC=new (window.AudioContext||window.webkitAudioContext)();
 COMP=AC.createDynamicsCompressor();COMP.threshold.value=-14;COMP.ratio.value=4;COMP.connect(AC.destination);
 MASTER=AC.createGain();MASTER.gain.value=.8;MASTER.connect(COMP);
 AN=AC.createAnalyser();AN.fftSize=256;MASTER.connect(AN);
 const len=AC.sampleRate*2,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;NOISE=b;
 return AC}
const now=()=>AC.currentTime;
/* briques */
function env(g,t,a,peak,dec,sus=0){g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(Math.max(sus,0.0001),t+a+dec)}
function osc(type,f,t,dur,peak,dest,{a=.005,detune=0}={}){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.detune.value=detune;env(g,t,a,peak,dur);o.connect(g);g.connect(dest||MASTER);o.start(t);o.stop(t+a+dur+.05);return o}
function noise(t,dur,peak,{type='bandpass',f=1000,q=1,dest,a=.005}={}){const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NOISE;s.loop=true;fl.type=type;fl.frequency.setValueAtTime(f,t);fl.Q.value=q;env(g,t,a,peak,dur);s.connect(fl);fl.connect(g);g.connect(dest||MASTER);s.start(t,Math.random()*1.5);s.stop(t+a+dur+.05);return {s,fl,g}}
function thump(t,f=70,peak=.9,dur=.35){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(f*2.2,t);o.frequency.exponentialRampToValueAtTime(f,t+.08);env(g,t,.004,peak,dur);o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+dur+.1)}
const N=n=>440*Math.pow(2,(n-69)/12);
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* ===== BOUCLES ===== */
const LOOPS={};
function loopWind(){/* vent polaire : bruit filtré qui respire, panoramique lent, grincements de tôle */
 const out=AC.createGain();out.gain.value=0;out.connect(MASTER);out.gain.linearRampToValueAtTime(.55,now()+2);
 const mk=(f,pan)=>{const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain(),p=AC.createStereoPanner?AC.createStereoPanner():null;s.buffer=NOISE;s.loop=true;fl.type='bandpass';fl.frequency.value=f;fl.Q.value=.8;g.gain.value=.5;
  const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=.07+Math.random()*.08;lg.gain.value=f*.6;l.connect(lg);lg.connect(fl.frequency);l.start();
  const l2=AC.createOscillator(),lg2=AC.createGain();l2.frequency.value=.11+Math.random()*.1;lg2.gain.value=.35;l2.connect(lg2);lg2.connect(g.gain);l2.start();
  s.connect(fl);fl.connect(g);if(p){p.pan.value=pan;g.connect(p);p.connect(out)}else g.connect(out);s.start();return [s,l,l2]};
 const nodes=[...mk(420,-.6),...mk(900,.5),...mk(240,0)];
 const low=AC.createOscillator(),lg=AC.createGain(),lf=AC.createBiquadFilter();low.type='sawtooth';low.frequency.value=41;lf.type='lowpass';lf.frequency.value=120;lg.gain.value=.12;low.connect(lf);lf.connect(lg);lg.connect(out);low.start();nodes.push(low);
 let alive=true;const creak=()=>{if(!alive)return;const t=now();const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o.type='sawtooth';const f0=180+Math.random()*160;o.frequency.setValueAtTime(f0,t);o.frequency.linearRampToValueAtTime(f0*(.7+Math.random()*.6),t+.9);f.type='bandpass';f.frequency.value=900;f.Q.value=12;env(g,t,.25,.05,.8);o.connect(f);f.connect(g);g.connect(out);o.start(t);o.stop(t+1.3);setTimeout(creak,4000+Math.random()*7000)};setTimeout(creak,3000);
 return ()=>{alive=false;const t=now();out.gain.cancelScheduledValues(t);out.gain.setValueAtTime(out.gain.value,t);out.gain.linearRampToValueAtTime(0,t+1.2);setTimeout(()=>nodes.forEach(n=>{try{n.stop()}catch(e){}}),1400)}}
function loopMusic(){/* tension : ostinato grave à 92 bpm, nappe mineure, battement de cœur, cloche de glace */
 const out=AC.createGain();out.gain.value=.0001;out.connect(MASTER);out.gain.exponentialRampToValueAtTime(.7,now()+1.5);
 const bpm=92,beat=60/bpm,bass=[38,38,41,38,36,38,43,41],pad=[[50,53,57],[48,52,55],[46,50,53],[45,48,52]];
 let step=0,nextT=now()+.1,alive=true;
 const padBus=AC.createBiquadFilter();padBus.type='lowpass';padBus.frequency.value=900;padBus.connect(out);
 const sched=()=>{if(!alive)return;while(nextT<now()+.3){const t=nextT,s=step;
   /* basse en croches */
   const f=N(bass[Math.floor(s/2)%8]);const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=f;fl.type='lowpass';fl.frequency.setValueAtTime(700,t);fl.frequency.exponentialRampToValueAtTime(160,t+beat*.45);env(g,t,.005,.22,beat*.45);o.connect(fl);fl.connect(g);g.connect(out);o.start(t);o.stop(t+beat*.5);
   /* nappe toutes les 2 mesures */
   if(s%16===0){const ch=pad[(s/16)%4];ch.forEach((n,k)=>{[-6,6].forEach(dt=>{const p=AC.createOscillator(),pg=AC.createGain();p.type='sawtooth';p.frequency.value=N(n);p.detune.value=dt;pg.gain.setValueAtTime(.0001,t);pg.gain.exponentialRampToValueAtTime(.035,t+1.2);pg.gain.setValueAtTime(.035,t+beat*7);pg.gain.exponentialRampToValueAtTime(.0001,t+beat*8.2);p.connect(pg);pg.connect(padBus);p.start(t);p.stop(t+beat*8.4)})})}
   /* cœur : boum-boum sur les temps 1 */
   if(s%8===0){const kt=t;[[0,.55],[.18,.35]].forEach(([d,v])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(110,kt+d);o.frequency.exponentialRampToValueAtTime(46,kt+d+.1);env(g,kt+d,.004,v,.22);o.connect(g);g.connect(out);o.start(kt+d);o.stop(kt+d+.3)})}
   /* cloche de glace de temps en temps */
   if(s%32===14){[1,2.76,5.4].forEach((m,k)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=N(86)*m/2;env(g,t,.002,.06/(k+1),2.2);o.connect(g);g.connect(out);o.start(t);o.stop(t+2.4)})}
   step++;nextT+=beat/2}
  setTimeout(sched,60)};sched();
 return ()=>{alive=false;const t=now();out.gain.cancelScheduledValues(t);out.gain.setValueAtTime(Math.max(out.gain.value,.0001),t);out.gain.exponentialRampToValueAtTime(.0001,t+1)}}
function loopAlarm(){/* réunion : deux tons carrés + vibration, comme sur les stations */
 let alive=true,k=0;const tick=()=>{if(!alive)return;const t=now();const f=k%2?660:880;osc('square',f,t,.22,.14);osc('square',f*1.003,t,.22,.08);if(k%4===0)buzz(200);k++;setTimeout(tick,300)};tick();
 return ()=>{alive=false}}
function loopCritical(){/* compteur critique sur le hub : tic aigu qui accélère légèrement */
 let alive=true,iv=1;const tick=()=>{if(!alive)return;const t=now();osc('square',1760,t,.03,.09);osc('sine',880,t,.06,.05);iv=Math.max(.35,iv*.97);setTimeout(tick,iv*1000)};tick();return ()=>{alive=false}}

/* ===== SONS PONCTUELS ===== */
const ONE={
 tap(){const t=now();osc('square',620,t,.03,.08)},
 stationBip(){const t=now();osc('sine',1200,t,.07,.25);osc('sine',1200,t+.12,.07,.25)},
 success(){const t=now();[72,76,79,84].forEach((n,i)=>{osc('triangle',N(n),t+i*.07,.25,.28);osc('sine',N(n+12),t+i*.07,.2,.06)});buzz(60)},
 fail(){const t=now();const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(320,t);o.frequency.exponentialRampToValueAtTime(70,t+.6);env(g,t,.01,.25,.6);const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=1400;o.connect(f);f.connect(g);g.connect(MASTER);o.start(t);o.stop(t+.7);
  for(let i=0;i<9;i++)noise(t+.25+i*.05+Math.random()*.03,.05,.18,{type:'highpass',f:5000+Math.random()*3000,q:2});thump(t+.2,55,.6);buzz([80,60,160])},
 unfreeze(){const t=now();noise(t,.5,.12,{type:'highpass',f:3000,q:.7,a:.2});[84,88,91].forEach((n,i)=>osc('sine',N(n),t+.3+i*.06,.4,.12))},
 penalty(){const t=now();osc('square',220,t,.12,.12);osc('square',185,t+.14,.25,.12)},

 wake(){const t=now();[60,67,72,79].forEach((n,i)=>osc('triangle',N(n),t+i*.12,.5,.15));buzz([100,60,100])},

 body(){const t=now();[[36,0],[37,0],[43,0]].forEach(([n])=>{osc('sawtooth',N(n),t,.9,.12);});noise(t,.9,.25,{type:'bandpass',f:3200,q:6,a:.02});const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(N(84),t);o.frequency.exponentialRampToValueAtTime(N(96),t+.7);env(g,t,.02,.06,.7);o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+.8);thump(t,45,1,.6);buzz([300])},
 present(){const t=now();osc('sine',760,t,.06,.18)},
 debateTick(){const t=now();osc('square',1200,t,.04,.12)},
 voteOk(){const t=now();osc('triangle',N(76),t,.12,.2);osc('triangle',N(83),t+.09,.2,.2)},
 voteLate(){const t=now();osc('sawtooth',160,t,.3,.18)},
 tally(){const t=now();for(let i=0;i<6;i++)osc('square',N(60+i*2),t+i*.09,.06,.06);thump(t+.6,70,.5)},
 chef(){const t=now();[67,72,76].forEach((n,i)=>{osc('sawtooth',N(n),t+i*.02,.9,.07);});thump(t,80,.4)},
 reveal(){/* identique pour chercheur et hôte */const t=now();[1,2.01,3.02].forEach((m,k)=>osc('sine',520*m,t,1.1/(k+1),.18/(k+1)));buzz(80)},
 countdown(){const t=now();[0,.8,1.6].forEach(d=>osc('square',440,t+d,.1,.15));osc('triangle',880,t+2.4,.6,.25);osc('triangle',1320,t+2.4,.6,.12);thump(t+2.4,60,.8)},
 quarantine(){const t=now();/* sas : chuintement, porte qui s'ouvre, blizzard, porte qui claque, rôle */
  noise(t,.6,.25,{type:'highpass',f:1500,q:.5,a:.05});thump(t+.7,48,.8,.5);
  const w=noise(t+.8,3,.45,{type:'bandpass',f:500,q:.6,a:.6});w.fl.frequency.linearRampToValueAtTime(1400,t+2.6);
  for(let i=0;i<5;i++)noise(t+1+i*.5,.25,.06,{type:'bandpass',f:180,q:3});
  thump(t+4.6,40,1,.7);noise(t+4.6,.3,.3,{type:'lowpass',f:500,q:.6});
  for(let i=0;i<10;i++)noise(t+4.75+i*.04,.04,.12,{type:'highpass',f:6000,q:2});buzz([0,4600,200])},
 roleCh(){const t=now();[60,64,67,72].forEach((n,i)=>osc('triangle',N(n),t+i*.05,1.2,.12))},
 roleHo(){const t=now();[48,49,55,61].forEach(n=>osc('sawtooth',N(n),t,1.4,.07));const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(N(96),t);o.frequency.linearRampToValueAtTime(N(91),t+1.4);env(g,t,.3,.05,1.2);o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+1.6);thump(t,38,.9,.8)},
 winCh(){const t=now();const ch=[[60,64,67],[65,69,72],[67,71,74],[72,76,79,84]];ch.forEach((c,i)=>c.forEach(n=>{osc('sawtooth',N(n),t+i*.45,i===3?2.2:.5,.06,null,{a:.04});osc('triangle',N(n),t+i*.45,i===3?2.2:.5,.08,null,{a:.02})}));thump(t+1.35,70,.6)},
 winHo(){const t=now();[36,37,42,43].forEach(n=>osc('sawtooth',N(n),t,3,.08,null,{a:.4}));for(let i=0;i<8;i++)osc('sine',N(88+Math.floor(Math.random()*8)),t+.4+i*.3,.6,.04);const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(55,t);o.frequency.linearRampToValueAtTime(41,t+3);const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=260;env(g,t,.8,.25,2.4);o.connect(f);f.connect(g);g.connect(MASTER);o.start(t);o.stop(t+3.4);thump(t,32,1,1.2)}
};


const LOOPFN={wind:loopWind,music:loopMusic,alarm:loopAlarm,crit:loopCritical};const MUS={wind:1,music:1};
let fxOn=true,musOn=true;
function ready(){ctx();if(AC.state==='suspended')AC.resume()}
window.SND={
 play(k){if(!fxOn||!ONE[k])return;try{ready();ONE[k]()}catch(e){}},
 loop(k,on){if((MUS[k]&&!musOn)||(!MUS[k]&&!fxOn)){on=false}try{if(on&&!LOOPS[k]){ready();LOOPS[k]=LOOPFN[k]()}else if(!on&&LOOPS[k]){LOOPS[k]();delete LOOPS[k]}}catch(e){}},
 stopAll(){for(const k in LOOPS){try{LOOPS[k]()}catch(e){}delete LOOPS[k]}},
 setFx(v){fxOn=v;if(!v)['alarm','crit'].forEach(k=>this.loop(k,false))},
 setMus(v){musOn=v;if(!v)['wind','music'].forEach(k=>this.loop(k,false))},
 get musOn(){return musOn}};
})();

G.givre={t:'GIVRE',n:'Hublot givré',c:'Observation',time:30,noDeco:true,d:'Gratte le givre du hublot avec ton doigt, puis touche ce qui n’est pas normal dehors. 2 erreurs maximum.',init(a,api){
