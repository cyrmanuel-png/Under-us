<script>
/* ===== Moteur son Under Us (identique au banc son) ===== */
(function(){
let AC=null,MASTER=null,COMP=null,NOISE=null,AN=null;
function ctx(){
 if(AC)return AC;
 AC=new (window.AudioContext||window.webkitAudioContext)();
 COMP=AC.createDynamicsCompressor();COMP.threshold.value=-14;COMP.ratio.value=4;COMP.connect(AC.destination);
 MASTER=AC.createGain();MASTER.gain.value=.8;MASTER.connect(COMP);
 AN=AC.createAnalyser();AN.fftSize=256;MASTER.connect(AN);
 const len=AC.sampleRate*2,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;NOISE=b;
 return AC}
const now=()=>AC.currentTime;
/* briques */
function env(g,t,a,peak,dec,sus=0){g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(Math.max(sus,0.0001),t+a+dec)}
function osc(type,f,t,dur,peak,dest,{a=.005,detune=0}={}){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.detune.value=detune;env(g,t,a,peak,dur);o.connect(g);g.connect(dest||MASTER);o.start(t);o.stop(t+a+dur+.05);return o}
function noise(t,dur,peak,{type='bandpass',f=1000,q=1,dest,a=.005}={}){const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NOISE;s.loop=true;fl.type=type;fl.frequency.setValueAtTime(f,t);fl.Q.value=q;env(g,t,a,peak,dur);s.connect(fl);fl.connect(g);g.connect(dest||MASTER);s.start(t,Math.random()*1.5);s.stop(t+a+dur+.05);return {s,fl,g}}
function thump(t,f=70,peak=.9,dur=.35){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(f*2.2,t);o.frequency.exponentialRampToValueAtTime(f,t+.08);env(g,t,.004,peak,dur);o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+dur+.1)}
const N=n=>440*Math.pow(2,(n-69)/12);
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* ===== BOUCLES ===== */
const LOOPS={};
function loopWind(){/* vent polaire : bruit filtré qui respire, panoramique lent, grincements de tôle */
 const out=AC.createGain();out.gain.value=0;out.connect(MASTER);out.gain.linearRampToValueAtTime(.55,now()+2);
 const mk=(f,pan)=>{const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain(),p=AC.createStereoPanner?AC.createStereoPanner():null;s.buffer=NOISE;s.loop=true;fl.type='bandpass';fl.frequency.value=f;fl.Q.value=.8;g.gain.value=.5;
  const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=.07+Math.random()*.08;lg.gain.value=f*.6;l.connect(lg);lg.connect(fl.frequency);l.start();
  const l2=AC.createOscillator(),lg2=AC.createGain();l2.frequency.value=.11+Math.random()*.1;lg2.gain.value=.35;l2.connect(lg2);lg2.connect(g.gain);l2.start();
  s.connect(fl);fl.connect(g);if(p){p.pan.value=pan;g.connect(p);p.connect(out)}else g.connect(out);s.start();return [s,l,l2]};
 const nodes=[...mk(420,-.6),...mk(900,.5),...mk(240,0)];
 const low=AC.createOscillator(),lg=AC.createGain(),lf=AC.createBiquadFilter();low.type='sawtooth';low.frequency.value=41;lf.type='lowpass';lf.frequency.value=120;lg.gain.value=.12;low.connect(lf);lf.connect(lg);lg.connect(out);low.start();nodes.push(low);
 let alive=true;const creak=()=>{if(!alive)return;const t=now();const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o.type='sawtooth';const f0=180+Math.random()*160;o.frequency.setValueAtTime(f0,t);o.frequency.linearRampToValueAtTime(f0*(.7+Math.random()*.6),t+.9);f.type='bandpass';f.frequency.value=900;f.Q.value=12;env(g,t,.25,.05,.8);o.connect(f);f.connect(g);g.connect(out);o.start(t);o.stop(t+1.3);setTimeout(creak,4000+Math.random()*7000)};setTimeout(creak,3000);
 return ()=>{alive=false;const t=now();out.gain.cancelScheduledValues(t);out.gain.setValueAtTime(out.gain.value,t);out.gain.linearRampToValueAtTime(0,t+1.2);setTimeout(()=>nodes.forEach(n=>{try{n.stop()}catch(e){}}),1400)}}
function loopMusic(){/* tension : ostinato grave à 92 bpm, nappe mineure, battement de cœur, cloche de glace */
 const out=AC.createGain();out.gain.value=.0001;out.connect(MASTER);out.gain.exponentialRampToValueAtTime(.7,now()+1.5);
 const bpm=92,beat=60/bpm,bass=[38,38,41,38,36,38,43,41],pad=[[50,53,57],[48,52,55],[46,50,53],[45,48,52]];
 let step=0,nextT=now()+.1,alive=true;
 const padBus=AC.createBiquadFilter();padBus.type='lowpass';padBus.frequency.value=900;padBus.connect(out);
 const sched=()=>{if(!alive)return;while(nextT<now()+.3){const t=nextT,s=step;
   /* basse en croches */

   if(s%16===0){const ch=pad[(s/16)%4];ch.forEach((n,k)=>{[-6,6].forEach(dt=>{const p=AC.createOscillator(),pg=AC.createGain();p.type='sawtooth';p.frequency.value=N(n);p.detune.value=dt;pg.gain.setValueAtTime(.0001,t);pg.gain.exponentialRampToValueAtTime(.035,t+1.2);pg.gain.setValueAtTime(.035,t+beat*7);pg.gain.exponentialRampToValueAtTime(.0001,t+beat*8.2);p.connect(pg);pg.connect(padBus);p.start(t);p.stop(t+beat*8.4)})})}

   if(s%8===0){const kt=t;[[0,.55],[.18,.35]].forEach(([d,v])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(110,kt+d);o.frequency.exponentialRampToValueAtTime(46,kt+d+.1);env(g,kt+d,.004,v,.22);o.connect(g);g.connect(out);o.start(kt+d);o.stop(kt+d+.3)})}
   /* cloche de glace de temps en temps */
   if(s%32===14){[1,2.76,5.4].forEach((m,k)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=N(86)*m/2;env(g,t,.002,.06/(k+1),2.2);o.connect(g);g.connect(out);o.start(t);o.stop(t+2.4)})}
   step++;nextT+=beat/2}
  setTimeout(sched,60)};sched();
 return ()=>{alive=false;const t=now();out.gain.cancelScheduledValues(t);out.gain.setValueAtTime(Math.max(out.gain.value,.0001),t);out.gain.exponentialRampToValueAtTime(.0001,t+1)}}

G.infirm={t:'INFIRM.',n:'Infirmerie',c:'Rythme',time:35,d:'Touche l’écran pile quand un pic du cœur passe dans la fenêtre orange. Le cœur s’emballe à chaque réussite. 7 pics captés, 3 ratés maximum.',init(a,api){

 const X0=Math.max(4,ox+16*s),X1=Math.min(w-4,ox+344*s),Y0=oy+16*s,Y1=oy+466*s,SW=X1-X0,SH=Y1-Y0;
 const EY0=Y0+SH*.15,EY1=Y0+SH*.6,base=EY0+(EY1-EY0)*.62,AMP=(EY1-EY0)*.78;

 o.fillStyle='rgba(0,0,0,.18)';for(let y=Y0;y<Y1;y+=3)o.fillRect(X0,y,SW,1);

 o.fillStyle='rgba(255,255,255,.05)';o.beginPath();o.moveTo(X0,Y0);o.lineTo(X0+SW*.55,Y0);o.lineTo(X0,Y0+SH*.38);o.fill();
 o.fillStyle='rgba(255,255,255,.02)';o.beginPath();o.moveTo(X0+SW*.62,Y0);o.lineTo(X0+SW*.7,Y0);o.lineTo(X0,Y0+SH*.5);o.lineTo(X0,Y0+SH*.44);o.fill();

 const ecg=dd=>{if(dd>-46&&dd<-28)return -Math.sin((dd+46)/18*Math.PI)*.07;if(dd>=-7&&dd<-3)return (dd+7)/4*.09;if(dd>=-3&&dd<0)return .09-(dd+3)/3*1.09;if(dd>=0&&dd<4)return -1+dd/4*1.22;if(dd>=4&&dd<9)return .22-(dd-4)/5*.22;if(dd>=20&&dd<44)return -Math.sin((dd-20)/24*Math.PI)*.16;return 0};
 const miss=()=>{ko++;flashR=1;beep(150);buzz(40);upd();if(ko>=3)api.fail('Arythmie')};
 const mono=(t,px,col,xx,yy,al='left')=>{x.font=`${px}px 'Share Tech Mono',monospace`;x.fillStyle=col;x.textAlign=al;x.fillText(t,xx,yy)};
 api.loop(dt=>{tt+=dt;next-=dt;if(next<=0){peaks.push({x:X1+40,hit:false,b:false});next=rnd(.75,1.3)*100/spd}
  peaks.forEach(p=>{p.x-=spd*dt;if(!p.b&&p.x<mx){p.b=true;beat=1;if(!ended)beep(1180,.03,'sine',.02)}if(!p.hit&&!p.gone&&p.x<mx-22){p.gone=true;miss()}});peaks=peaks.filter(p=>p.x>X0-60);
  flashR=Math.max(0,flashR-dt*2.5);flashG=Math.max(0,flashG-dt*2.5);beat=Math.max(0,beat-dt*3);

  for(let j=EY0;j<EY1;j+=10){x.strokeStyle=(Math.round((j-EY0)/10)%5)?'rgba(40,110,70,.12)':'rgba(60,150,95,.24)';x.beginPath();x.moveTo(X0,j);x.lineTo(X1,j);x.stroke()}
  /* bandeau patient */
  x.fillStyle='rgba(75,227,138,.10)';x.fillRect(X0,Y0,SW,SH*.135);x.strokeStyle='rgba(75,227,138,.35)';x.beginPath();x.moveTo(X0,Y0+SH*.135);x.lineTo(X1,Y0+SH*.135);x.stroke();
  mono('LIT 02 · B. MORIN',12,'#9CF5C0',X0+8,Y0+SH*.118);mono('II  x1  25mm/s',10,'#4BE38A',X1-8,Y0+SH*.118,'right');
  /* fenêtre de capture */
  x.fillStyle=`rgba(255,106,26,${.13+flashG*.25})`;x.fillRect(mx-20,EY0,40,EY1-EY0);
  x.strokeStyle='#FF6A1A';x.lineWidth=2;[[mx-20,1],[mx+20,-1]].forEach(([bx,dir])=>{x.beginPath();x.moveTo(bx+dir*8,EY0+2);x.lineTo(bx,EY0+2);x.lineTo(bx,EY1-2);x.lineTo(bx+dir*8,EY1-2);x.stroke()});
  x.setLineDash([4,4]);x.beginPath();x.moveTo(mx,EY0);x.lineTo(mx,EY1);x.stroke();x.setLineDash([]);
