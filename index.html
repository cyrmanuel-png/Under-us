<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1218">
<title>Under Us</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&family=Share+Tech+Mono&display=swap">
<style>
:root{--encre:#05080B;--acier-c:#4C5862;--acier-l:#8A949C;--glace:#9CD8EE;--glace-s:#2A4757;--orange:#FF6A1A;--orange-c:#FFB07E;--orange-f:#B84A10;--rouge:#E0302A;--vert:#4BE38A;--lueur:#C98BFF;--txt:#E3F1F7;--txt-2:#86AEC1;
--f-titre:'Barlow Condensed',Impact,'Arial Narrow',sans-serif;--f-label:'Allerta Stencil','Arial Black',sans-serif;--f-corps:'Barlow','Segoe UI',system-ui,sans-serif;--f-chiffre:'Share Tech Mono',ui-monospace,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:repeating-linear-gradient(90deg,#2E373E 0 3px,#4A555E 3px 7px,#6E7A84 7px 9px,#3E4952 9px 13px,#2E373E 13px 16px);color:var(--txt);font-family:var(--f-corps)}
body{padding:max(10px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto}
.frame{position:relative;height:100%;border:2px solid var(--encre);background:#141B20;box-shadow:inset 0 4px 0 rgba(0,0,0,.5);display:flex;flex-direction:column;gap:9px;padding:10px 9px;overflow-y:auto}
.dep{position:relative}
.dep::before{content:"";position:absolute;inset:0;transform:translate(3px,4px);background:var(--encre);clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.plate{position:relative;background:var(--encre);padding:2px;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.plate>.in{background:var(--glace-s);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);box-shadow:inset 0 3px 0 #A9CAD8,inset -2px -3px 0 rgba(0,0,0,.4);padding:9px 10px}
.head .in{background:var(--orange);box-shadow:inset 2px 2px 0 var(--orange-c),inset -3px -4px 0 var(--orange-f);display:flex;justify-content:space-between;align-items:center;padding:7px 10px}
.brand{font-family:var(--f-titre);font-weight:600;font-size:21px;letter-spacing:2.5px;color:var(--encre);line-height:1}
.lab{font-family:var(--f-label);font-size:11px;letter-spacing:.6px}.mute{color:var(--txt-2)}
.small{font-size:12.5px;color:var(--txt-2);line-height:1.45;margin:0}
.tag{font-family:var(--f-label);font-size:12px;letter-spacing:1px;color:var(--lueur);text-align:center}
.big{width:100%;border:0;background:none;padding:0;text-align:center;flex:none}
.big .in{background:var(--orange);color:var(--encre);font-family:var(--f-titre);font-weight:600;font-size:20px;letter-spacing:2px;padding:12px;box-shadow:inset 2px 2px 0 var(--orange-c),inset -3px -4px 0 var(--orange-f)}
.big.alt .in{background:var(--acier-c);color:var(--txt);box-shadow:inset 2px 2px 0 var(--acier-l),inset -3px -4px 0 #151C21}
.big.red .in{background:var(--rouge);color:#FCE3E1;box-shadow:inset 2px 2px 0 #FF8A84,inset -3px -4px 0 #7A1210}
.big:disabled .in{background:#3A4249;color:#6E7A84;box-shadow:inset 2px 2px 0 #4C5862}
.big:not(:disabled):active .plate{transform:translate(2px,3px)}
.sizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.sz{border:0;background:none;padding:0;text-align:center}.sz .in{display:flex;flex-direction:column;gap:3px;padding:10px 4px}
.sz b{font-family:var(--f-titre);font-weight:600;font-size:17px;letter-spacing:1.5px}.sz span{font-size:11px;color:var(--txt-2)}
.sz.on .in{background:var(--glace);color:var(--encre)}.sz.on span{color:#1E3A48}
.join{display:flex;gap:8px}.join .big{width:auto}
input{width:100%;min-width:0;background:var(--encre);border:2px solid #000;box-shadow:inset 0 0 0 1.5px #3E6378;color:var(--txt);padding:8px 10px;font-family:var(--f-corps);font-size:17px}
#jc{font-family:var(--f-chiffre);font-size:22px;letter-spacing:6px;text-transform:uppercase}
input.err{box-shadow:inset 0 0 0 2px var(--rouge)}
.txt#nm{font-family:var(--f-titre);font-weight:600;font-size:22px;letter-spacing:2px;text-transform:uppercase}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.col{width:40px;height:40px;border:2px solid var(--encre);border-radius:50%;padding:0;box-shadow:inset 3px 3px 0 rgba(255,255,255,.35)}
.col.on{outline:3px solid var(--orange);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1.5px solid var(--encre);background:#1C252C;color:var(--txt);font-size:13px;padding:7px 11px;border-radius:16px;box-shadow:1.5px 2px 0 var(--encre)}
.chk{margin:0;padding-left:18px;font-size:13px;color:var(--txt-2);line-height:1.6}
.msg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.msg h2{margin:0;font-family:var(--f-titre);font-weight:600;font-size:32px;letter-spacing:2.5px}
.msg p{margin:0;font-size:14px;color:var(--txt-2);max-width:30ch;line-height:1.45}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid #2A4757;border-top-color:var(--glace);animation:spn 1s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
.qrbox{display:flex;gap:10px;align-items:center}
.qr{flex:none;width:132px;height:132px;background:#EEF6FA;border:2px solid var(--encre);padding:6px;box-shadow:3px 4px 0 var(--encre)}
.qr img,.qr canvas{width:100%!important;height:100%!important;display:block}
.code{display:flex;flex-direction:column;gap:4px;min-width:0}
.code .dg{font-family:var(--f-chiffre);font-size:40px;letter-spacing:5px;background:var(--encre);color:var(--glace);padding:2px 8px;text-shadow:0 0 10px rgba(156,216,238,.55)}
.code p{margin:0;font-size:12px;color:var(--txt-2);line-height:1.35}
.counts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.cnt{background:var(--encre);text-align:center;padding:4px;box-shadow:inset -1px -1px 0 #3E6378}
.cnt b{display:block;font-family:var(--f-chiffre);font-size:26px;color:var(--glace)}.cnt span{font-family:var(--f-label);font-size:9px;color:var(--txt-2)}
.plist{flex:1;min-height:60px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.pl{display:flex;align-items:center;gap:9px;background:#1C252C;border:1.5px solid var(--encre);padding:7px 9px}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--encre);flex:none}
.pl .nm{flex:1;min-width:0}.pl .nm b{display:block;font-family:var(--f-titre);font-weight:600;font-size:17px;letter-spacing:1px}.pl .nm span{display:block;font-size:12px;color:var(--txt-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.led{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--encre);background:#2A353D;flex:none}
.led.ok{background:var(--vert);box-shadow:0 0 6px var(--vert)}.led.wait{background:#F2B21E;animation:bl .8s steps(1) infinite}.led.off{background:var(--rouge)}
@keyframes bl{50%{opacity:.25}}
.hubtop{display:flex;gap:6px}.hubtop .dep{flex:1}
.hb{width:44px;border:1.5px solid var(--encre);background:var(--acier-c);font-family:var(--f-titre);font-weight:600;font-size:20px;box-shadow:inset 1.5px 1.5px 0 var(--acier-l),2px 2px 0 var(--encre)}
.urg{background:#2A1A08;border:1.5px solid var(--orange);padding:6px 9px;font-size:13px;color:#FFD0B0}.urg b{color:#FFE0C8}
.sg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start}
.st .in{position:relative;overflow:hidden;padding:7px 8px 8px}
.st .r1{display:flex;justify-content:space-between}.st .t{font-family:var(--f-label);font-size:12px}.st .no{font-family:var(--f-label);font-size:10px;color:#5E8296}
.st .loc{font-size:11.5px;color:var(--txt-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 5px}
.seg{position:relative;background:var(--encre);padding:3px 7px;font-family:var(--f-chiffre);font-size:30px;line-height:1;text-align:center;letter-spacing:2px}
.seg .gh{position:absolute;inset:3px 7px;color:#0F2430}.seg .v{position:relative;color:#8FE0FF;text-shadow:0 0 8px rgba(143,224,255,.6)}
.st .bar{height:6px;background:#030506;margin-top:6px}.st .bar>div{height:100%;background:#8FCBE2}
.st.warn .seg .v{color:#FF9A4A}.st.warn .bar>div{background:var(--orange)}
.st.crit .in{background:#4A1410}.st.crit .seg .v{color:#FF3B30;animation:bl .9s steps(1) infinite}.st.crit .bar>div{background:var(--rouge)}
.st .ice{position:absolute;inset:0;background:rgba(200,224,234,.96);color:var(--encre);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--f-label)}
.st .ice.off{background:rgba(74,20,16,.95);color:#FFB0A8}
.meet{border:0;background:none;padding:0;width:100%;margin-top:auto}
.meet .in{background:repeating-linear-gradient(-45deg,#FF6A1A 0 9px,#0A1218 9px 18px);padding:3px;box-shadow:none}
.meet .mi{padding:11px;background:#D7261E;text-align:center;font-family:var(--f-titre);font-weight:600;font-size:19px;letter-spacing:1.5px;color:#FCE3E1}
.ovl{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,8,11,.88)}
.ovl[hidden]{display:none!important}
.pan{width:100%;max-width:460px;background:#1C252C;border:2px solid var(--encre);box-shadow:inset 0 4px 0 #A9CAD8,5px 6px 0 var(--encre);padding:14px 12px;display:flex;flex-direction:column;gap:10px;text-align:center}
.pan.red{box-shadow:inset 0 4px 0 #FF8A84,5px 6px 0 var(--encre)}
.pan h3{margin:0;font-family:var(--f-titre);font-weight:600;font-size:30px;letter-spacing:2px}.pan p{margin:0;font-size:13.5px;color:var(--txt-2);line-height:1.45}
.sys{flex:1;min-height:240px;border:2px solid var(--encre);background:radial-gradient(ellipse at 50% 35%,#1E3A4A,#0E1A22 65%,#081016);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px}
.sys h2{margin:0;font-family:var(--f-titre);font-weight:600;font-size:38px;letter-spacing:3px}.sys p{margin:0;font-size:14px;color:var(--txt-2);max-width:28ch;line-height:1.45}
.sys.alarm{animation:alarm 1s steps(1) infinite;background:#3A0C08}.sys.alarm p,.sys.alarm .lab{color:#FFD0C8}
@keyframes alarm{50%{background:#7A1A12}}
.sys.frozen{background:radial-gradient(ellipse at 50% 40%,#DCEBF1,#9FBFCC 60%,#6E8FA0)}.sys.frozen h2,.sys.frozen .lab{color:var(--encre)}.sys.frozen p{color:#1E3A48}
.sys.paused{background:repeating-linear-gradient(-45deg,#1C252C 0 14px,#151C21 14px 28px)}
.big7{font-family:var(--f-chiffre);font-size:56px;background:var(--encre);color:var(--glace);padding:4px 14px}
.ghost{border:1.5px solid var(--encre);background:#3A1410;color:#FFB0A8;font-family:var(--f-label);font-size:11px;padding:11px;box-shadow:2px 2px 0 var(--encre)}
.mg{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;align-items:center}
.gauge{position:relative;width:100%;height:70px;background:var(--encre);border:2px solid #000;box-shadow:inset -1px -1px 0 #3E6378}
.gauge .zone{position:absolute;top:0;bottom:0;background:var(--vert);opacity:.85}
.gauge .needle{position:absolute;top:-10px;bottom:-10px;width:6px;margin-left:-3px;background:var(--orange);border:1.5px solid var(--encre)}
.pips{display:flex;gap:6px;align-items:center;font-family:var(--f-label);font-size:10px;color:var(--txt-2)}
.pips i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--encre);background:#2A353D}.pips i.ok{background:var(--vert)}.pips i.ko{background:var(--rouge)}
.tb{width:100%;height:7px;background:#030506}.tb>div{height:100%;background:var(--glace)}
.row2{display:flex;gap:8px}
.mono{font-family:var(--f-chiffre)}
.setpan{text-align:left;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);padding:12px 12px 10px;gap:7px}
.setpan h3{font-size:22px;letter-spacing:1.5px}.setpan>p{font-size:12px}
.setbody{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
.sgrp{color:var(--glace);margin:8px 0 2px;font-size:10px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid #2E3A42;font-size:13px;line-height:1.2;color:#C4DEE9}
.srow input{width:58px;flex:none;padding:3px 6px;height:30px;font-size:16px;text-align:right;font-family:var(--f-chiffre)}
.setpan .row2{flex:none}.setpan .row2 .big{flex:1 1 0;width:auto;min-width:0}.setpan .big .in{padding:9px 6px;font-size:15px;letter-spacing:1px}
.srow input:disabled{opacity:.6}
.u{font-style:normal;font-family:var(--f-label);font-size:10px;color:var(--txt-2);min-width:24px}
.hubtop .hb{flex:none}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* v0.3 : rôles, vote, quarantaine */
.ovl{overflow-y:auto;align-items:flex-start}.ovl>.pan{margin:auto 0}
.st.hit .plate{animation:hitb .45s steps(2,end) infinite}
@keyframes hitb{50%{filter:brightness(1.6) saturate(2);box-shadow:0 0 0 4px #E8321E,0 0 22px #E8321E}}
.st{position:relative}.hitb{position:absolute;right:6px;top:22px;z-index:3;background:#E8321E;color:#fff;border:2px solid var(--encre);font-family:var(--f-titre);font-weight:600;font-size:18px;padding:1px 7px;transform:rotate(-6deg);box-shadow:2px 2px 0 var(--encre)}
.gath{display:flex;flex-direction:column;align-items:center;gap:4px;background:#2A0E0C;border:1.5px solid var(--rouge);padding:8px}.gath .lab{color:#FFB0A8}
.row2 .big{flex:1 1 0;width:auto;min-width:0}
.row2 .big .in{font-size:17px;padding:11px 6px}
.hrow{display:flex;align-items:center;gap:8px;background:var(--encre);padding:5px 8px;box-shadow:inset -1px -1px 0 #3E6378}
.hb.sm{width:36px;height:32px;font-size:20px;line-height:1;padding:0}
.hrow b{font-size:24px;color:var(--lueur);min-width:22px;text-align:center}.hrow .small{margin-left:auto;text-align:right}
.del{border:1.5px solid var(--encre);background:#3A1410;color:#FFB0A8;width:32px;height:32px;padding:0;font-size:14px;flex:none}
.ghost.ice2{background:#16303C;color:var(--glace)}
.avat{width:54px;height:54px;border-radius:50% 50% 40% 40%;border:3px solid var(--encre);box-shadow:inset 4px 4px 0 rgba(255,255,255,.3),3px 4px 0 var(--encre)}
.avat.big{width:84px;height:84px}
.role{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:18px;border:2px solid var(--encre)}
.role h2{margin:0;font-family:var(--f-titre);font-weight:600;font-size:46px;letter-spacing:3px}
.role p{margin:0;font-size:14.5px;line-height:1.5;max-width:32ch}
.role.ch{background:radial-gradient(ellipse at 50% 30%,#2C5A70,#0E1A22 70%)}.role.ch h2,.role.ch .lab{color:var(--glace)}.role.ch p{color:#C8E4F0}
.role.ho{background:radial-gradient(ellipse at 50% 30%,#4B137F,#22073D 70%)}.role.ho h2,.role.ho .lab{color:#F0DEFF;text-shadow:0 0 14px #C98BFF}.role.ho p{color:#E2C8FF}
.role .mates{font-size:15px;padding:8px 10px;background:rgba(0,0,0,.35);border:1.5px solid rgba(0,0,0,.5)}
.crew{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;background:var(--encre);padding:5px 7px}
.crew.in{justify-content:center;background:rgba(0,0,0,.35)}
.cm{position:relative;display:flex;align-items:center;gap:4px;font-family:var(--f-titre);font-weight:600;font-size:13px;letter-spacing:.5px;color:var(--txt)}
.cm i{width:15px;height:15px;border-radius:50%;border:1.5px solid #000;flex:none}
.cm em{position:absolute;left:-4px;top:-7px;font-style:normal;font-size:11px;color:#FFD34A;text-shadow:0 0 3px #000}
.cm.mort{color:#6E8FA0;text-decoration:line-through}
.cm.quar{color:#8A949C;text-decoration:line-through}.cm.quar i{outline:2px dashed #FF6A1A;outline-offset:1px}
.botrow{display:flex;gap:8px;margin-top:auto;align-items:stretch}.botrow .meet{margin-top:0;flex:1}.botrow .ghost{flex:none;width:86px;font-size:12px}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;max-height:46vh;overflow-y:auto}
.vb{display:flex;align-items:center;gap:7px;border:1.5px solid var(--encre);background:#26323A;padding:10px 8px;font-family:var(--f-titre);font-weight:600;font-size:17px;letter-spacing:1px;text-align:left;box-shadow:2px 2px 0 var(--encre);min-width:0;overflow:hidden}
.vb i{width:20px;height:20px;border-radius:50%;border:1.5px solid #000;flex:none}
.vb:active{transform:translate(2px,2px);box-shadow:none}
.big7.sm{font-size:36px;align-self:center;padding:2px 12px}
.conf{background:#2A0E0C;border:1.5px solid var(--rouge);padding:9px;display:flex;flex-direction:column;gap:8px}.conf p{color:#FFD0C8}
.victim{display:flex;align-items:center;gap:9px;justify-content:center;background:#CFE6EF;color:var(--encre);padding:7px}
.victim i{width:26px;height:26px;border-radius:50%;border:2px solid #000;opacity:.6}.victim b{font-family:var(--f-titre);font-size:20px;letter-spacing:1px}.victim span{font-size:12px}
.tally{display:flex;flex-direction:column;gap:5px;text-align:left}
.tally.over{flex:1;overflow-y:auto}

.tr i{width:20px;height:20px;border-radius:50%;border:1.5px solid #000}.tr b{font-family:var(--f-titre);font-size:17px;letter-spacing:1px}
.tr .who{grid-column:2/4;font-size:11.5px;color:var(--txt-2)}
.tr.top{background:#4A1410}.tr.hoR{background:#2E0B4F}.tr.hoR .lab{color:#F0DEFF}.tr .lab{color:var(--glace)}
.win{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:18px 12px;border:2px solid var(--encre)}
.win h2{margin:0;font-family:var(--f-titre);font-weight:600;font-size:34px;letter-spacing:2.5px}.win p{margin:0;font-size:14px}
.win.ch{background:radial-gradient(ellipse at 50% 30%,#2C5A70,#0E1A22 75%)}.win.ch h2{color:var(--glace)}.win.ch .lab,.win.ch p{color:#C8E4F0}
.win.ho{background:radial-gradient(ellipse at 50% 30%,#4B137F,#22073D 75%)}.win.ho h2{color:#F0DEFF;text-shadow:0 0 14px #C98BFF}.win.ho .lab,.win.ho p{color:#E2C8FF}
.qpan h3{font-size:28px}
.qz{position:relative;height:230px;border:2px solid var(--encre);overflow:hidden;background:#0B1218}
.qz .snow{position:absolute;inset:0;background:repeating-linear-gradient(100deg,rgba(255,255,255,.0) 0 14px,rgba(255,255,255,.55) 14px 16px,rgba(255,255,255,0) 16px 40px),linear-gradient(#DCEBF1,#7FA7B8);background-size:120px 100%,100% 100%;animation:blz .35s linear infinite}

.qz .door::after{content:"";position:absolute;top:44%;width:10px;height:34px;background:var(--orange);border:1.5px solid #000}
.qz .dl{left:0}.qz .dl::after{right:8px}.qz .dr{right:0}.qz .dr::after{left:8px}
.qz.open .dl{transform:translateX(-100%)}.qz.open .dr{transform:translateX(100%)}
.qz .who{position:absolute;z-index:2;left:50%;bottom:14px;width:52px;height:84px;margin-left:-26px;border-radius:26px 26px 8px 8px;background:var(--c);border:3px solid var(--encre);box-shadow:inset 5px 5px 0 rgba(255,255,255,.25);transition:transform 1.8s ease-in,opacity 1.8s ease-in}
.qz .who::before{content:"";position:absolute;left:10px;right:10px;top:12px;height:20px;border-radius:10px;background:#F2D3B3;border:2px solid #000}
.qz.walk .who{transform:translateY(-70px) scale(.25);opacity:0}
.qz .frost{position:absolute;inset:0;z-index:3;background:radial-gradient(ellipse at 50% 50%,rgba(220,235,241,0) 30%,rgba(220,235,241,.9));opacity:0;transition:opacity .8s}
.qz.shut .frost{opacity:1}
.qrole{min-height:40px;font-family:var(--f-titre);font-weight:600;font-size:26px;letter-spacing:2px}
.qrole.ch{color:var(--glace);text-shadow:0 0 10px rgba(156,216,238,.7)}.qrole.ho{color:#F0DEFF;text-shadow:0 0 14px #C98BFF;animation:qpop .5s}
@keyframes qpop{from{transform:scale(1.4);opacity:0}}

/* v0.5 : accueil + choix de taille */
.frame.homef{padding:0;gap:0;background:#03070D;overflow:hidden}
.homebg{position:absolute;inset:0;overflow:hidden}
.hsc{position:absolute;inset:0;width:100%;height:100%}
.hsc .aur{animation:aur 7s ease-in-out infinite alternate}@keyframes aur{from{opacity:.55;transform:translateX(-12px)}to{opacity:1;transform:translateX(12px)}}
.hsc .blk{animation:bl 1.4s steps(2) infinite}
.hsc .par{animation:parb 3.6s ease-in-out infinite}@keyframes parb{50%{transform:translateY(-6px);opacity:.75}}
.blz{position:absolute;inset:-20%;background:repeating-linear-gradient(105deg,transparent 0 22px,rgba(227,241,247,.10) 22px 23px,transparent 23px 58px);animation:blz2 1.2s linear infinite;pointer-events:none}
@keyframes blz2{to{transform:translate(-58px,22px)}}
.homec{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;padding:6vh 16px 14px;gap:10px;overflow-y:auto}
.logow{width:min(100%,380px);filter:drop-shadow(0 6px 0 rgba(5,8,11,.6))}
.logo{width:100%;height:auto;display:block;overflow:visible}
.lgt{font-family:var(--f-titre);font-weight:600}
.lgus{animation:usg 3.2s ease-in-out infinite}@keyframes usg{50%{filter:drop-shadow(0 0 10px #C98BFF)}}
.tagline{margin-top:-4px;transform:rotate(-2deg)}
.tagline span{display:inline-block;font-family:var(--f-label);font-size:13px;letter-spacing:2.5px;color:#F0DEFF;background:#22073D;border:2px solid var(--encre);padding:5px 12px;box-shadow:3px 4px 0 var(--encre);text-shadow:0 0 8px #C98BFF}
.hact{margin-top:auto;width:100%;max-width:400px;display:flex;flex-direction:column;gap:8px;padding-bottom:18px}
.hsep{display:flex;align-items:center;gap:8px;color:var(--txt-2);font-family:var(--f-label);font-size:11px;letter-spacing:1px}
.hsep::before,.hsep::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,#3E6378)}.hsep::after{transform:scaleX(-1)}
.hsep span{text-shadow:0 1px 0 #000}
.hhelp{text-align:center;color:#C7DCE5;background:rgba(3,7,13,.72);border:1.5px solid #05080B;padding:5px 8px;font-size:11.5px}
.ver{position:absolute;right:10px;bottom:8px;font-family:var(--f-chiffre);font-size:10px;color:#5E7F90}
.szq{display:flex;flex-direction:column;gap:3px;background:rgba(5,8,11,.82);border:1.5px solid #05080B;padding:7px 9px}.szq .lab{color:var(--glace);font-size:13px}
.szl{display:flex;flex-direction:column;gap:12px}
.szc{position:relative;display:flex;gap:12px;align-items:stretch;text-align:left;border:2px solid var(--encre);background:#1C252C;padding:0;box-shadow:4px 5px 0 var(--encre);clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);transition:transform .12s}
.szc:active{transform:translate(2px,3px)}
.szi{flex:none;width:118px;border-right:2px solid var(--encre);background:#0E2232}.szi svg{display:block;width:100%;height:100%}
.szt{display:flex;flex-direction:column;gap:4px;padding:10px 34px 10px 0;min-width:0}
.szt b{font-family:var(--f-titre);font-weight:600;font-size:26px;letter-spacing:2.5px;line-height:1}
.szt>span{font-size:12.5px;color:var(--txt-2);line-height:1.35}
.szm{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.szm i{font-style:normal;display:flex;align-items:center;gap:4px;font-family:var(--f-chiffre);font-size:12px;color:var(--glace)}.szm svg{width:13px;height:13px}
.szck{position:absolute;right:8px;top:8px;width:24px;height:24px;display:grid;place-items:center;border:2px solid var(--encre);background:#2A353D;color:transparent;font-weight:700;font-size:15px}
.szc.on{background:#2A1A0F;box-shadow:4px 5px 0 var(--encre),inset 0 0 0 3px var(--orange)}
.szc.on .szt b{color:var(--orange)}.szc.on .szck{background:var(--orange);color:var(--encre)}
.szc.on .szi{background:#14293A}

/* v0.6 : habillage graphique — boutons (pack 1) et plaques de station (pack 2) */
.big .dep::before,.meet .dep::before,.st.dep::before{display:none}
.big .plate,.meet .plate,.st .plate{background:none;clip-path:none;padding:0}
.big .plate,.meet .plate{filter:drop-shadow(2px 3px 0 rgba(5,8,11,.85))}
.big .plate>.in{clip-path:none;background:none!important;box-shadow:none!important;border:solid transparent;border-width:15px 26px 13px;border-image:var(--b-or) 50 80 45 fill/15px 26px 13px stretch;padding:4px 4px;min-height:22px;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 0 rgba(255,200,160,.5)}
.big.alt .plate>.in{border-image-source:var(--b-ac);color:#EAF4F8;text-shadow:0 2px 0 #05080B}
.big.red .plate>.in{border-image-source:var(--b-ro);color:#FFF4F2;text-shadow:0 2px 0 #4A0A08}
.big:disabled .plate{filter:grayscale(.85) brightness(.6) drop-shadow(2px 3px 0 rgba(5,8,11,.85))}.big:disabled .plate>.in{color:#B9C2C8;text-shadow:none}
.meet .plate>.in{clip-path:none;background:none!important;box-shadow:none!important;border:solid transparent;border-width:17px 28px;border-image:var(--b-ur) 60 90 fill/17px 28px stretch;padding:0}
.meet .mi{background:none;padding:3px 4px;font-size:17px;color:#FFF4F2;text-shadow:0 2px 0 #4A0A08}
.st .plate>.in{clip-path:none;box-shadow:none;background:var(--p-n) center/100% 100% no-repeat!important;aspect-ratio:1.28;padding:0;overflow:visible}
.st.warn .plate>.in{background-image:var(--p-w)!important}.st.crit .plate>.in{background-image:var(--p-c)!important}
.st .r1{position:absolute;left:12%;right:12%;top:13%;height:12%;align-items:center}
.st .t{font-size:12px;color:#F2F7FA;text-shadow:0 1px 0 #05080B,0 0 3px #05080B}.st .no{font-size:11px;color:#F2F7FA;text-shadow:0 1px 0 #05080B,0 0 3px #05080B}
.st .loc{position:absolute;left:12%;right:12%;bottom:5%;margin:0;font-size:11px;color:#F2F7FA;text-shadow:0 1px 0 #05080B,0 0 3px #05080B;text-align:center}
.st .seg{position:absolute;left:13.5%;right:13%;top:28.5%;height:32.5%;background:none;padding:0;display:flex;align-items:center;justify-content:center;font-size:clamp(20px,7.6vw,32px)}
.st .seg .gh{inset:0;display:flex;align-items:center;justify-content:center}
.st .bar{position:absolute;left:13.5%;right:13%;top:73.8%;height:4.6%;margin:0;background:none}
.st .ice{background:var(--p-f) center/100% 100% no-repeat;justify-content:flex-end;padding-bottom:8%}
.st .ice b{background:rgba(5,8,11,.75);color:#DCEBF1;padding:1px 8px;font-size:12px}.st .ice span{background:rgba(5,8,11,.75);color:#9CD8EE;padding:0 6px}
.st .ice.off{background:rgba(74,20,16,.92);justify-content:center;padding:0}
.st .hitb{top:16%}

.hsi{position:absolute;left:50%;bottom:0;height:max(100%,calc(min(100vw,520px)*1.777));aspect-ratio:941/1672;transform:translateX(-50%)}
.hsi img{display:block;width:100%;height:100%}
.hbk{position:absolute;left:57.3%;top:54.7%;width:9%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,80,60,.95) 0 18%,rgba(255,60,40,.35) 40%,transparent 70%);animation:bl 1.4s steps(2) infinite}
.hwg{position:absolute;left:10%;right:0;bottom:0;height:16%;background:radial-gradient(ellipse at 50% 70%,rgba(201,139,255,.55),transparent 65%);animation:parb2 3.6s ease-in-out infinite}
@keyframes parb2{50%{opacity:.25}}

<script>
/* ===== Moteur son Under Us (identique au banc son) ===== */
(function(){
let AC=null,MASTER=null,COMP=null,NOISE=null,AN=null;
function ctx(){
 if(AC)return AC;
 AC=new (window.AudioContext||window.webkitAudioContext)();
 COMP=AC.createDynamicsCompressor();COMP.threshold.value=-14;COMP.ratio.value=4;COMP.connect(AC.destination);
 MASTER=AC.createGain();MASTER.gain.value=.8;MASTER.connect(COMP);
 AN=AC.createAnalyser();AN.fftSize=256;MASTER.connect(AN);
 const len=AC.sampleRate*2,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;NOISE=b;
 return AC}
const now=()=>AC.currentTime;
/* briques */
function env(g,t,a,peak,dec,sus=0){g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(Math.max(sus,0.0001),t+a+dec)}
function osc(type,f,t,dur,peak,dest,{a=.005,detune=0}={}){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.detune.value=detune;env(g,t,a,peak,dur);o.connect(g);g.connect(dest||MASTER);o.start(t);o.stop(t+a+dur+.05);return o}
function noise(t,dur,peak,{type='bandpass',f=1000,q=1,dest,a=.005}={}){const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NOISE;s.loop=true;fl.type=type;fl.frequency.setValueAtTime(f,t);fl.Q.value=q;env(g,t,a,peak,dur);s.connect(fl);fl.connect(g);g.connect(dest||MASTER);s.start(t,Math.random()*1.5);s.stop(t+a+dur+.05);return {s,fl,g}}
function thump(t,f=70,peak=.9,dur=.35){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(f*2.2,t);o.frequency.exponentialRampToValueAtTime(f,t+.08);env(g,t,.004,peak,dur);o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+dur+.1)}
const N=n=>440*Math.pow(2,(n-69)/12);
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* ===== BOUCLES ===== */
const LOOPS={};
function loopWind(){/* ambiance : glockenspiel lointain, petites notes rares et inquiétantes (gamme à triton), écho froid */
 const out=AC.createGain();out.gain.value=.0001;out.connect(MASTER);out.gain.exponentialRampToValueAtTime(.5,now()+1.5);
 const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=5200;lp.connect(out);
 const dl=AC.createDelay(2),fb=AC.createGain(),wet=AC.createGain();dl.delayTime.value=.62;fb.gain.value=.38;wet.gain.value=.35;lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(out);
 const scale=[74,75,78,81,82,86,87,90];/* ré, mib, fa#, la, sib… : mineur + triton */
 let alive=true,last=-1;
 const bell=(t,n,v)=>{[[1,1,1.9],[2.76,.32,.7],[5.4,.12,.35],[8.93,.05,.18]].forEach(([m,a,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=N(n)*m;o.detune.value=(Math.random()-.5)*8;env(g,t,.002,v*a,d);o.connect(g);g.connect(lp);o.start(t);o.stop(t+d+.1)})};
 const play=()=>{if(!alive)return;const t=now()+.05;let i;do{i=Math.floor(Math.random()*scale.length)}while(i===last);last=i;const n=scale[i],v=.05+Math.random()*.035;
  bell(t,n,v);const r=Math.random();
  if(r<.28)bell(t+.32+Math.random()*.25,n+1,v*.7);/* seconde mineure qui grince */
  else if(r<.42)bell(t+.45,n-6,v*.6);/* triton descendant */
  else if(r<.5){bell(t+.28,n,v*.55);bell(t+.56,n,v*.3)}/* note qui insiste */
  setTimeout(play,2600+Math.random()*4800)};
 setTimeout(play,900);
 return ()=>{alive=false;const t=now();out.gain.cancelScheduledValues(t);out.gain.setValueAtTime(Math.max(out.gain.value,.0001),t);out.gain.exponentialRampToValueAtTime(.0001,t+1.5);setTimeout(()=>{try{out.disconnect()}catch(e){}},2500)}}
function loopMusic(){/* tension : ostinato grave à 92 bpm, nappe mineure, battement de cœur, cloche de glace */
 const out=AC.createGain();out.gain.value=.0001;out.connect(MASTER);out.gain.exponentialRampToValueAtTime(.7,now()+1.5);
 const bpm=92,beat=60/bpm,bass=[38,38,41,38,36,38,43,41],pad=[[50,53,57],[48,52,55],[46,50,53],[45,48,52]];
 let step=0,nextT=now()+.1,alive=true;
 const padBus=AC.createBiquadFilter();padBus.type='lowpass';padBus.frequency.value=900;padBus.connect(out);
 const sched=()=>{if(!alive)return;while(nextT<now()+.3){const t=nextT,s=step;
   /* basse en croches */
   const f=N(bass[Math.floor(s/2)%8]);const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=f;fl.type='lowpass';fl.frequency.setValueAtTime(700,t);fl.frequency.exponentialRampToValueAtTime(160,t+beat*.45);env(g,t,.005,.22,beat*.45);o.connect(fl);fl.connect(g);g.connect(out);o.start(t);o.stop(t+beat*.5);
   /* nappe toutes les 2 mesures */
   if(s%16===0){const ch=pad[(s/16)%4];ch.forEach((n,k)=>{[-6,6].forEach(dt=>{const p=AC.createOscillator(),pg=AC.createGain();p.type='sawtooth';p.frequency.value=N(n);p.detune.value=dt;pg.gain.setValueAtTime(.0001,t);pg.gain.exponentialRampToValueAtTime(.035,t+1.2);pg.gain.setValueAtTime(.035,t+beat*7);pg.gain.exponentialRampToValueAtTime(.0001,t+beat*8.2);p.connect(pg);pg.connect(padBus);p.start(t);p.stop(t+beat*8.4)})})}
   /* cœur : boum-boum sur les temps 1 */
   if(s%8===0){const kt=t;[[0,.55],[.18,.35]].forEach(([d,v])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(110,kt+d);o.frequency.exponentialRampToValueAtTime(46,kt+d+.1);env(g,kt+d,.004,v,.22);o.connect(g);g.connect(out);o.start(kt+d);o.stop(kt+d+.3)})}
   /* cloche de glace de temps en temps */
   if(s%32===14){[1,2.76,5.4].forEach((m,k)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=N(86)*m/2;env(g,t,.002,.06/(k+1),2.2);o.connect(g);g.connect(out);o.start(t);o.stop(t+2.4)})}
   step++;nextT+=beat/2}
  setTimeout(sched,60)};sched();
 return ()=>{alive=false;const t=now();out.gain.cancelScheduledValues(t);out.gain.setValueAtTime(Math.max(out.gain.value,.0001),t);out.gain.exponentialRampToValueAtTime(.0001,t+1)}}
function loopAlarm(){/* réunion : deux tons carrés + vibration, comme sur les stations */
 let alive=true,k=0;const tick=()=>{if(!alive)return;const t=now();const f=k%2?660:880;osc('square',f,t,.22,.14);osc('square',f*1.003,t,.22,.08);if(k%4===0)buzz(200);k++;setTimeout(tick,300)};tick();
 return ()=>{alive=false}}
function loopCritical(){/* compteur critique sur le hub : tic aigu qui accélère légèrement */
 let alive=true,iv=1;const tick=()=>{if(!alive)return;const t=now();osc('square',1760,t,.03,.09);osc('sine',880,t,.06,.05);iv=Math.max(.35,iv*.97);setTimeout(tick,iv*1000)};tick();return ()=>{alive=false}}

/* ===== SONS PONCTUELS ===== */
const ONE={
 tap(){const t=now();osc('square',620,t,.03,.08)},
 stationBip(){const t=now();osc('sine',1200,t,.07,.25);osc('sine',1200,t+.12,.07,.25)},
 success(){const t=now();[72,76,79,84].forEach((n,i)=>{osc('triangle',N(n),t+i*.07,.25,.28);osc('sine',N(n+12),t+i*.07,.2,.06)});buzz(60)},
 fail(){const t=now();const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(320,t);o.frequency.exponentialRampToValueAtTime(70,t+.6);env(g,t,.01,.25,.6);const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=1400;o.connect(f);f.connect(g);g.connect(MASTER);o.start(t);o.stop(t+.7);
  for(let i=0;i<9;i++)noise(t+.25+i*.05+Math.random()*.03,.05,.18,{type:'highpass',f:5000+Math.random()*3000,q:2});thump(t+.2,55,.6);buzz([80,60,160])},
 unfreeze(){const t=now();noise(t,.5,.12,{type:'highpass',f:3000,q:.7,a:.2});[84,88,91].forEach((n,i)=>osc('sine',N(n),t+.3+i*.06,.4,.12))},
 penalty(){const t=now();osc('square',220,t,.12,.12);osc('square',185,t+.14,.25,.12)},
 repaired(){const t=now();osc('sine',N(83),t,.1,.15);osc('sine',N(90),t+.08,.25,.15)},
 fuse(){const t=now();noise(t,.12,.6,{type:'bandpass',f:2400,q:.8});for(let i=0;i<6;i++)noise(t+.05+Math.random()*.35,.03,.25,{type:'highpass',f:4000,q:1});thump(t,90,.5,.2);noise(t+.1,.6,.08,{type:'lowpass',f:700,q:.5,a:.1})},
 wake(){const t=now();[60,67,72,79].forEach((n,i)=>osc('triangle',N(n),t+i*.12,.5,.15));buzz([100,60,100])},
 meetCall(){const t=now();[0,.16,.32].forEach((d,i)=>osc('square',i%2?660:880,t+d,.12,.18));thump(t,60,.7);buzz([200,100,200])},
 body(){const t=now();[[36,0],[37,0],[43,0]].forEach(([n])=>{osc('sawtooth',N(n),t,.9,.12);});noise(t,.9,.25,{type:'bandpass',f:3200,q:6,a:.02});const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(N(84),t);o.frequency.exponentialRampToValueAtTime(N(96),t+.7);env(g,t,.02,.06,.7);o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+.8);thump(t,45,1,.6);buzz([300])},
 present(){const t=now();osc('sine',760,t,.06,.18)},
 debateTick(){const t=now();osc('square',1200,t,.04,.12)},
 voteOk(){const t=now();osc('triangle',N(76),t,.12,.2);osc('triangle',N(83),t+.09,.2,.2)},
 voteLate(){const t=now();osc('sawtooth',160,t,.3,.18)},
 tally(){const t=now();for(let i=0;i<6;i++)osc('square',N(60+i*2),t+i*.09,.06,.06);thump(t+.6,70,.5)},
 chef(){const t=now();[67,72,76].forEach((n,i)=>{osc('sawtooth',N(n),t+i*.02,.9,.07);});thump(t,80,.4)},
 reveal(){/* identique pour chercheur et hôte */const t=now();[1,2.01,3.02].forEach((m,k)=>osc('sine',520*m,t,1.1/(k+1),.18/(k+1)));buzz(80)},
 countdown(){const t=now();[0,.8,1.6].forEach(d=>osc('square',440,t+d,.1,.15));osc('triangle',880,t+2.4,.6,.25);osc('triangle',1320,t+2.4,.6,.12);thump(t+2.4,60,.8)},
 quarantine(){const t=now();/* sas : chuintement, porte qui s'ouvre, blizzard, porte qui claque, rôle */
  noise(t,.6,.25,{type:'highpass',f:1500,q:.5,a:.05});thump(t+.7,48,.8,.5);
  const w=noise(t+.8,3,.45,{type:'bandpass',f:500,q:.6,a:.6});w.fl.frequency.linearRampToValueAtTime(1400,t+2.6);
  for(let i=0;i<5;i++)noise(t+1+i*.5,.25,.06,{type:'bandpass',f:180,q:3});
  thump(t+4.6,40,1,.7);noise(t+4.6,.3,.3,{type:'lowpass',f:500,q:.6});
  for(let i=0;i<10;i++)noise(t+4.75+i*.04,.04,.12,{type:'highpass',f:6000,q:2});buzz([0,4600,200])},
 roleCh(){const t=now();[60,64,67,72].forEach((n,i)=>osc('triangle',N(n),t+i*.05,1.2,.12))},
 roleHo(){const t=now();[48,49,55,61].forEach(n=>osc('sawtooth',N(n),t,1.4,.07));const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(N(96),t);o.frequency.linearRampToValueAtTime(N(91),t+1.4);env(g,t,.3,.05,1.2);o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+1.6);thump(t,38,.9,.8)},
 winCh(){const t=now();const ch=[[60,64,67],[65,69,72],[67,71,74],[72,76,79,84]];ch.forEach((c,i)=>c.forEach(n=>{osc('sawtooth',N(n),t+i*.45,i===3?2.2:.5,.06,null,{a:.04});osc('triangle',N(n),t+i*.45,i===3?2.2:.5,.08,null,{a:.02})}));thump(t+1.35,70,.6)},
 winHo(){const t=now();[36,37,42,43].forEach(n=>osc('sawtooth',N(n),t,3,.08,null,{a:.4}));for(let i=0;i<8;i++)osc('sine',N(88+Math.floor(Math.random()*8)),t+.4+i*.3,.6,.04);const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(55,t);o.frequency.linearRampToValueAtTime(41,t+3);const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=260;env(g,t,.8,.25,2.4);o.connect(f);f.connect(g);g.connect(MASTER);o.start(t);o.stop(t+3.4);thump(t,32,1,1.2)}
};


const LOOPFN={wind:loopWind,music:loopMusic,alarm:loopAlarm,crit:loopCritical};const MUS={wind:1,music:1};
let fxOn=true,musOn=true;
function ready(){ctx();if(AC.state==='suspended')AC.resume()}
window.SND={
 play(k){if(!fxOn||!ONE[k])return;try{ready();ONE[k]()}catch(e){}},
 loop(k,on){if((MUS[k]&&!musOn)||(!MUS[k]&&!fxOn)){on=false}try{if(on&&!LOOPS[k]){ready();LOOPS[k]=LOOPFN[k]()}else if(!on&&LOOPS[k]){LOOPS[k]();delete LOOPS[k]}}catch(e){}},
 stopAll(){for(const k in LOOPS){try{LOOPS[k]()}catch(e){}delete LOOPS[k]}},
 setFx(v){fxOn=v;if(!v)['alarm','crit'].forEach(k=>this.loop(k,false))},
 setMus(v){musOn=v;if(!v)['wind','music'].forEach(k=>this.loop(k,false))},
 get musOn(){return musOn}};
})();
</script>

 maison:{stMin:3,stMax:5,partie:20,plafond:5,departMin:60,departMax:100,parStation:0,gel:20,penalite:20,recharge:4,debat:90,debatJoueur:30,vote:10},

const FIELDS=[
 ['Stations',[['stMin','Stations minimum',''],['stMax','Stations maximum',''],['partie','Durée visée','min']]],
 ['Compteurs',[['plafond','Plafond d’un système','min'],['departMin','Départ le plus bas','%'],['departMax','Départ le plus haut','%'],['parStation','Bonus par station en plus','s']]],

function maxMs(n){const c=C();const nb=n==null?Object.keys(stations).length:n;return (c.plafond*60+c.parStation*Math.max(0,nb-c.stMin))*1000}
const fmt=ms=>{let s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const S=k=>{try{window.SND&&SND.play(k)}catch(e){}};

let db=null,uid=null,offset=0,code=null,role=null,meta={},players={},stations={},roles={},timer=null,wakeLock=null,lastState=null;
/* équipage : joueurs avec station prête + joueurs sans station créés sur le hub */

const alive=()=>crew().filter(([,p])=>!p.out);
const avIdx=c=>{const i=COLORS.indexOf(c);return i<0?0:i};
const avs=(c,h)=>`background:${esc(c||'#8A949C')} url(img/av${h?'h':''}${avIdx(c)}.webp) center/cover no-repeat`;
const FIN_IMG={c:'img/fin_chercheurs.webp',h:'img/fin_hotes.webp'};
function overDecor(w){const f=document.querySelector('.frame');if(f&&FIN_IMG[w]){f.classList.add('overf','ov'+w);f.style.backgroundImage=`url(${FIN_IMG[w]})`;const wn=f.querySelector('.win');if(wn)wn.insertAdjacentHTML('afterend','<div class="ovsp"></div>')}}
const pname=id=>((players[id]||{}).name||'?').toUpperCase();
const defHosts=n=>n<=6?1:n<=10?2:3;
const maxHosts=n=>Math.max(1,Math.floor((n-1)/2));
const nHosts=()=>{const n=crew().length;return Math.min(maxHosts(n),Math.max(1,meta.nHosts||defHosts(n)))};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function crewBand(showRoles){return crew().map(([id,p])=>{const o=p.out,r=roles[id];return `<span class="cm${o?' '+o:''}${showRoles&&r==='h'?' ho':''}" title="${esc(p.name)}"><i style="${avs(p.color)}"></i>${id===meta.chef&&!o?'<em>★</em>':''}<b>${esc((p.name||'?').toUpperCase())}</b></span>`}).join('')}
const now=()=>Date.now()+offset;
const R=p=>db.ref('rooms/'+code+(p?'/'+p:''));

function plate(inner,cls=''){return `<div class="dep ${cls}"><div class="plate"><div class="in">${inner}</div></div></div>`}
function bigBtn(id,label,cls=''){return `<button class="big ${cls}" id="${id}">${plate(label)}</button>`}
function header(title,right=''){return `<div class="dep head"><div class="plate"><div class="in"><span class="brand">${title}</span><span class="lab" style="color:#05080B">${right}</span></div></div></div>`}
function screen(html){app.innerHTML=`<div class="frame">${html}</div>`}
function fatal(msg){screen(header('UNDER US')+`<div class="msg"><h2>OUPS</h2><p>${esc(msg)}</p></div>`+bigBtn('retry','RÉESSAYER'));$('#retry').onclick=()=>location.reload()}

async function keepAwake(){noSleepVideo();try{if('wakeLock' in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}catch(e){}}

/* ===== Démarrage ===== */
async function boot(){
 screen(header('UNDER US')+`<div class="msg"><div class="spin"></div><p>Connexion à la station…</p></div>`);
 try{
  firebase.initializeApp(firebaseConfig);db=firebase.database();
  const cred=await firebase.auth().signInAnonymously();uid=cred.user.uid;
  db.ref('.info/serverTimeOffset').on('value',s=>offset=s.val()||0);
 }catch(e){fatal('Impossible de joindre Firebase ('+(e.code||e.message)+'). Vérifie la connexion 4G/5G.');return}
 const q=new URLSearchParams(location.search);const r=(q.get('r')||'').toUpperCase(),h=(q.get('hub')||'').toUpperCase();
 if(h){const m=(await db.ref('rooms/'+h+'/meta').get()).val();if(m&&m.hub===uid){code=h;role='hub';listenRoom();keepAwake();return}}
 if(r)joinRoom(r);else home();
}

/* ===== HUB ===== */
async function createRoom(){
 S('tap');const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c='';
 for(let k=0;k<6;k++){c=Array.from({length:4},()=>A[Math.floor(Math.random()*A.length)]).join('');const s=await db.ref('rooms/'+c+'/meta').get();if(!s.exists())break}
 code=c;role='hub';
 await R('meta').set({hub:uid,size,cfg:presetFor(size),state:'lobby',created:firebase.database.ServerValue.TIMESTAMP});
 history.replaceState(null,'','?hub='+code);
 listenRoom();hubLobby();keepAwake();
}
function listenRoom(){
 R('meta').on('value',s=>{meta=s.val()||{};render()});
 R('players').on('value',s=>{players=s.val()||{};if(role==='hub')autoPause();render()});
 R('stations').on('value',s=>{stations=s.val()||{};render()});
 if(role==='hub')R('roles').on('value',s=>{roles=s.val()||{};render()});
 if(timer)clearInterval(timer);timer=setInterval(render,250);
}
function joinUrl(){return location.origin+location.pathname+'?r='+code}
function render(){if(role==='hub')hubRender();else if(role==='station')stRender()}

function hubLobby(){
 screen(`<div class="hubtop">${header('SALLE D’ATTENTE',SIZES[meta.size||size].label)}<button class="hb" id="hSet" aria-label="Réglages">⚙</button></div>`+`
 <div class="qrbox"><div class="qr" id="qr"></div><div class="code"><span class="lab mute">CODE</span><span class="dg">${code}</span><p>Scanne le QR code avec chaque téléphone qui sera une station.</p></div></div>
 <div class="counts"><div class="cnt"><b id="cJ">0</b><span>JOUEURS</span></div><div class="cnt"><b id="cR">0</b><span>STATIONS PRÊTES</span></div></div>
 <div class="hrow"><span class="lab mute">HÔTES</span><button class="hb sm" id="hMinus" aria-label="Moins d’hôtes">−</button><b class="mono" id="hN">1</b><button class="hb sm" id="hPlus" aria-label="Plus d’hôtes">+</button><span class="small" id="hInfo"></span></div>
 <div class="plist" id="plist"></div>
 <button class="ghost ice2" id="addP">+ AJOUTER UN JOUEUR SANS STATION</button>
 ${bigBtn('launch','EN ATTENTE DES STATIONS…')}<div class="ovl" id="hOvl" hidden></div>`);
 $('#hSet').onclick=()=>openSettings(true);
 try{new QRCode($('#qr'),{text:joinUrl(),width:200,height:200,colorDark:'#05080B',colorLight:'#EEF6FA',correctLevel:QRCode.CorrectLevel.M})}catch(e){$('#qr').textContent=joinUrl()}
 const setH=d=>{const n=crew().length;R('meta/nHosts').set(Math.min(maxHosts(n),Math.max(1,nHosts()+d)));S('tap')};
 $('#hMinus').onclick=()=>setH(-1);$('#hPlus').onclick=()=>setH(1);
 $('#addP').onclick=addPlayer;
 $('#plist').onclick=e=>{const b=e.target.closest('[data-del]');if(b){R('players/'+b.dataset.del).remove();S('tap')}};
 $('#launch').onclick=launch;lobbyHtml='';hubRender();
}

 const o=$('#hOvl');let col=COLORS[Math.floor(Math.random()*COLORS.length)];
 o.innerHTML=`<div class="pan"><h3>JOUEUR SANS STATION</h3><p>Pour quelqu’un qui joue sans téléphone (ou pour le porteur du hub). Il voit son rôle sur le hub.</p>
 <input class="txt" id="npN" maxlength="10" placeholder="PRÉNOM" autocomplete="off" style="font-family:var(--f-titre);font-size:22px;letter-spacing:2px;text-transform:uppercase">

 mTo.push(setTimeout(()=>{S(h?'roleHo':'roleCh');vib([60,40,60]);const r=$('#qR');r.className='qrole '+(h?'ho':'ch');const qw=$('#qWho');if(qw&&h)qw.style.cssText=avs(p.color,true);r.innerHTML=`ÉTAIT ${h?'UN HÔTE':'UN CHERCHEUR'}`},4200));
 mTo.push(setTimeout(async()=>{await R('players/'+id+'/out').set('quar');if(await checkWin())return;const nc=await ensureChef();
  if(nc){o.innerHTML=`<div class="pan"><span class="lab mute">CHEF DE MISSION</span><h3>${esc(pname(nc))} ★</h3><p>Nouveau chef tiré au sort parmi les vivants.</p></div>`;S('chef');mTo.push(setTimeout(endMeeting,2600))}else endMeeting()},6000));
}
async function endMeeting(){clearMeet();mPhase='';await resumeRoom(true)}
function openSettings(editable){
 const o=$('#hOvl');if(!o)return;const c=C();const ed=editable&&meta.state==='lobby';
 o.innerHTML=`<div class="pan setpan"><h3>RÉGLAGES · ${SIZES[meta.size||'terrain'].label}</h3><p>${ed?'Modifiables jusqu’au lancement, mémorisés sur ce téléphone.':'Partie en cours : lecture seule.'}</p><div class="setbody">
  ${FIELDS.map(([t,rows])=>`<div class="lab sgrp">${t.toUpperCase()}</div>${rows.map(([k,l,u])=>`<label class="srow" for="cf_${k}"><span>${l}</span><span style="display:flex;align-items:center;gap:5px"><input id="cf_${k}" data-k="${k}" type="number" inputmode="decimal" value="${c[k]}" ${ed?'':'disabled'} ><i class="u">${u}</i></span></label>`).join('')}`).join('')}</div>
  <div class="row2">${ed?bigBtn('cfReset','PAR DÉFAUT','alt'):''}${bigBtn('cfOk',ed?'ENREGISTRER':'FERMER')}</div></div>`;
 o.hidden=false;
 const read=()=>{const n={};document.querySelectorAll('[data-k]').forEach(i=>{const v=parseFloat(String(i.value).replace(',','.'));n[i.dataset.k]=isFinite(v)?v:c[i.dataset.k]});if(n.departMax<n.departMin)n.departMax=n.departMin;if(n.stMax<n.stMin)n.stMax=n.stMin;return n};
 const r=$('#cfReset');if(r)r.onclick=()=>{const d=PRESETS[meta.size||'terrain'];document.querySelectorAll('[data-k]').forEach(i=>i.value=d[i.dataset.k])};
 $('#cfOk').onclick=async()=>{if(ed){const n=read();storePreset(meta.size||'terrain',n);await R('meta/cfg').set(n);S('repaired')}o.hidden=true;o.innerHTML='';if(meta.state==='meeting')meetingPanel();else if(meta.state==='paused')onHubState('paused')};
}
async function pauseRoom(state,reason,auto=false){await R('meta').update({state,reason,pausedAt:now(),auto:!!auto,allHere:null,victim:null})}
async function resumeRoom(afterMeeting){
 const d=now()-(meta.pausedAt||now());const upd={'meta/state':'game','meta/reason':null,'meta/pausedAt':null,'meta/auto':null,'meta/allHere':null,'meta/victim':null};if(afterMeeting===true)upd['meta/coolUntil']=now()+C().recharge*60000;
 Object.entries(stations).forEach(([id,s])=>{upd['stations/'+id+'/endAt']=s.endAt+d;if((s.frozenUntil||0)>(meta.pausedAt||0))upd['stations/'+id+'/frozenUntil']=s.frozenUntil+d});
 await R().update(upd);
}
function autoPause(){
 if(!meta.state)return;
 const offline=Object.entries(stations).filter(([id])=>players[id]&&players[id].online===false);
 if(meta.state==='game'&&offline.length){const s=offline[0][1];S('penalty');pauseRoom('paused',`Station ${String(s.num).padStart(2,'0')} · ${s.loc} déconnectée`,true)}
 else if(meta.state==='paused'&&meta.auto&&!offline.length){S('repaired');resumeRoom()}
}
function hubOver(){
 if(!Object.keys(roles).length||!Object.keys(players).length){lastState=null;return}
 clearMeet();L('music',false);L('crit',false);L('wind',false);const w=meta.winner||'h';S(w==='c'?'winCh':'winHo');
 const rows=crew().map(([id,p])=>`<div class="tr ${roles[id]==='h'?'hoR':''}"><i style="${avs(p.color,roles[id]==='h')}"></i><b>${esc(pname(id))}</b><span class="lab">${roles[id]==='h'?'HÔTE':'CHERCHEUR'}</span><div class="who">${p.out==='mort'?'mort':p.out==='quar'?'en quarantaine':'vivant'}${id===meta.chef?' · chef ★':''}</div></div>`).join('');
 screen(header('FIN DE PARTIE')+`<div class="win ${w==='c'?'ch':'ho'}"><span class="lab">${esc(meta.reason||'')}</span><h2>${w==='c'?'LES CHERCHEURS GAGNENT':'LES HÔTES GAGNENT'}</h2><p>${w==='c'?'Le parasite est enfermé dehors. La station est sauvée.':'Le parasite a pris la station.'}</p></div><div class="tally over">${rows}</div>${bigBtn('again','REJOUER · MÊMES JOUEURS')}${bigBtn('newG','NOUVELLE PARTIE','alt')}`);
 overDecor(w);
 $('#again').onclick=async()=>{lastState=null;overSet=false;const upd={'meta/state':'lobby','meta/reason':null,'meta/pausedAt':null,'meta/winner':null,'meta/victim':null,'meta/chef':null,'meta/revealIdx':null,'meta/startAt':null,'meta/crew':null,stations:null,roles:null};crew().forEach(([id])=>upd['players/'+id+'/out']=null);await R().update(upd)};
 $('#newG').onclick=()=>{location.href=location.pathname};
}

/* ===== STATION ===== */
let me={name:'',color:COLORS[0],loc:''},stView='';
async function joinRoom(c){
 code=c;const m=await db.ref('rooms/'+code+'/meta').get();
 if(!m.exists()){screen(header('UNDER US')+`<div class="msg"><h2>CODE INCONNU</h2><p>Aucune partie « ${esc(code)} ». Vérifie le code affiché sur le hub.</p></div>`+bigBtn('back','RETOUR'));$('#back').onclick=()=>{location.href=location.pathname};return}
 role='station';history.replaceState(null,'','?r='+code);
 {const pl=(await db.ref('rooms/'+code+'/players').get()).val()||{},mm=m.val()||{},cf=Object.assign({},PRESETS[mm.size||'terrain'],mm.cfg||{});
  const ready=Object.entries(pl).filter(([id,p])=>p.ready&&id!==uid).length;
  if(!pl[uid]&&ready>=cf.stMax){screen(header('UNDER US')+`<div class="msg"><h2>PARTIE COMPLÈTE</h2><p>Cette partie a déjà ${cf.stMax} stations, le maximum réglé sur le hub.</p></div>`);return}}
 const ex=(await R('players/'+uid).get()).val();if(ex){me=Object.assign(me,ex)}
 const pref=R('players/'+uid);
 db.ref('.info/connected').on('value',s=>{if(s.val()){pref.child('online').onDisconnect().set(false);pref.child('online').set(true)}});
 listenRoom();
 if(ex&&ex.ready){stView='';render()}else stPerso();
}
function stPerso(){
 stView='perso';
 screen(header('NOUVEAU MEMBRE','PARTIE '+code)+`
 <label class="lab mute" for="nm">TON PRÉNOM</label><input class="txt" id="nm" maxlength="10" value="${esc(me.name)}" placeholder="PRÉNOM" autocomplete="off">
 <div class="lab mute">TON PERSONNAGE</div>
 <div class="colors">${COLORS.map(c=>`<button class="col${c===me.color?' on':''}" data-c="${c}" style="${avs(c)}" aria-label="Personnage ${COLORS.indexOf(c)+1}"></button>`).join('')}</div>
 <label class="lab mute" for="loc">OÙ POSES-TU TA STATION ?</label><input class="txt" id="loc" maxlength="40" value="${esc(me.loc)}" placeholder="Ex. Garage, sur l’établi" autocomplete="off">
 <div class="chips">${['Cuisine','Salon','Garage','Grenier','Cave','Chambre','Entrée','Jardin'].map(r=>`<button class="chip" data-r="${r}">${r}</button>`).join('')}</div>
 <div class="lab mute">AVANT D’ACTIVER</div>
 <ul class="chk"><li>Mode « Ne pas déranger »</li><li>Économiseur de batterie coupé</li><li>Volume à fond, luminosité haute</li></ul>
 ${bigBtn('act','ACTIVER LA STATION')}`);
 document.querySelectorAll('.col').forEach(b=>b.onclick=()=>{me.color=b.dataset.c;document.querySelectorAll('.col').forEach(x=>x.classList.toggle('on',x===b));S('tap')});
 document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const l=$('#loc');l.value=b.dataset.r+(l.value&&!ROOMS_RE.test(l.value)?', '+l.value:', ');l.focus();S('tap')});
 $('#act').onclick=async()=>{
  const n=$('#nm').value.trim(),l=$('#loc').value.trim().replace(/,\s*$/,'');
  if(!n){$('#nm').classList.add('err');$('#nm').focus();return}if(l.length<3){$('#loc').classList.add('err');$('#loc').focus();return}
  me.name=n;me.loc=l;S('stationBip');keepAwake();
  await R('players/'+uid).update({name:n,color:me.color,loc:l,ready:true,online:true,joined:firebase.database.ServerValue.TIMESTAMP});
  stView='';render()};
}
const ROOMS_RE=/^(Cuisine|Salon|Garage|Grenier|Cave|Chambre|Entrée|Jardin)/;
function stRender(){
 if(stView==='game'&&meta.state&&meta.state!=='game')closeGame();
 if(stView==='body'&&meta.state!=='game'&&meta.state!=='paused'){stView='';lastState=null}
 if(stView==='perso'||stView==='game'||stView==='body')return;
 const st=meta.state,mine=stations[uid];
 if(st==='lobby'||!mine){if(lastState!=='lobby-wait'){lastState='lobby-wait';stWait()}return}
 const ref=st==='game'?now():(meta.pausedAt||now());const fz=(mine.frozenUntil||0)>ref;
 const key=st==='meeting'?(meta.allHere?'meeting-here':'meeting'):st+(fz?'-fz':'');
 if(key!==lastState){const prev=lastState;lastState=key;stShow(key,prev)}
 if(fz&&$('#fzT'))$('#fzT').textContent=fmt(mine.frozenUntil-ref);
}
function stWait(){L('alarm',false);screen(header('STATION PRÊTE','PARTIE '+code)+`<div class="msg"><div class="spin"></div><h2>EN VEILLE</h2><p>${esc(me.name)} · ${esc(me.loc)}</p><p class="small">Laisse ce téléphone ici, écran allumé. Il se réveille tout seul au lancement.</p></div>`+bigBtn('edit','MODIFIER MON PERSO OU LE LIEU','alt'));$('#edit').onclick=async()=>{await R('players/'+uid+'/ready').set(false);stPerso()}}
function stShow(key,prev){
 const mine=stations[uid];L('alarm',false);
 const head=header(`STATION ${String(mine.num).padStart(2,'0')} · ${esc(mine.game)}`,esc((mine.loc||'').split(',')[0].toUpperCase()));
 if(key==='reveal'){L('wind',false);if(prev==='lobby-wait'){S('wake');vib([100,60,100])}screen(head+`<div class="sys paused"><span class="lab" style="color:var(--glace)">MISSION EN PRÉPARATION</span><h2>TOUS AU HUB</h2><p>Le hub révèle les rôles, un joueur à la fois. Ta station se réveillera au lancement de la mission.</p></div>`)}
 if(key==='game'){if(prev==='lobby-wait'||prev==='reveal'){S('wake');vib([100,60,100])}if(prev==='game-fz')S('unfreeze');L('wind',true);
  screen(head+`<div class="sys"><span class="lab" style="color:var(--glace)">SYSTÈME VITAL · ${esc(mine.game)}</span><h2>${esc(gameName(mine.game).toUpperCase())}</h2><p>Touche pour réparer. Ton temps restant n’apparaît que sur le hub.</p></div>${bigBtn('fix','RÉPARER')}<button class="ghost" id="bodyB">SIGNALER UN CORPS</button>`);
  $('#fix').onclick=miniGame;$('#bodyB').onclick=bodyScreen}
 if(key==='game-fz'){screen(head+`<div class="sys frozen"><span class="lab">ÉCHEC · LA STATION GÈLE</span><h2>SYSTÈME GELÉ</h2><span class="big7" id="fzT">00:15</span><p>Une station au hasard a perdu du temps.</p></div><button class="ghost" id="bodyB">SIGNALER UN CORPS</button>`);$('#bodyB').onclick=bodyScreen}
 if(key==='meeting-here'){L('wind',false);if(prev==='meeting')S('tap');screen(head+`<div class="sys paused"><span class="lab" style="color:var(--glace)">RÉUNION AU HUB</span><h2>DÉBAT EN COURS</h2><p>${esc(meta.reason||'')}. La station attend la fin du vote.</p></div>`)}
 if(key==='meeting'){L('wind',false);S((meta.reason||'').startsWith('Corps')?'body':'meetCall');setTimeout(()=>{if(meta.state==='meeting'&&!meta.allHere)L('alarm',true)},900);
  screen(head+`<div class="sys alarm"><span class="lab">⚠ ALERTE ⚠</span><h2>RÉUNION D’URGENCE</h2><p>${esc(meta.reason||'')}. Rends-toi au hub tout de suite.</p></div>`)}
 if(key.startsWith('paused')){L('wind',false);screen(head+`<div class="sys paused"><div class="spin"></div><span class="lab" style="color:var(--orange)">PAUSE GÉNÉRALE</span><h2>PARTIE EN PAUSE</h2><p>${esc(meta.reason||'')}</p></div>`)}
 if(key.startsWith('over')){L('wind',false);const w=meta.winner||'h';S(w==='c'?'winCh':'winHo');screen(head+`<div class="win ${w==='c'?'ch':'ho'}" style="flex:1"><span class="lab">${esc(meta.reason||'')}</span><h2>${w==='c'?'LES CHERCHEURS GAGNENT':'LES HÔTES GAGNENT'}</h2><p>Les rôles sont affichés sur le hub.</p></div>`);overDecor(w)}
}
function bodyScreen(){stView='body';S('tap');screen(header('CORPS TROUVÉ')+'<div class="ovl" id="sOvl"></div>');bodyPicker($('#sOvl'))}
/* mini-jeu : générateur (tirer quand l'aiguille est dans le vert) */
let gameFrame=null,gameMsg=null;
function closeGame(){if(gameFrame){gameFrame.remove();gameFrame=null}if(gameMsg){window.removeEventListener('message',gameMsg);gameMsg=null}stView='';lastState=null}
function miniGame(){
 const mine=stations[uid];if(!mine)return;stView='game';L('wind',false);S('tap');
 const w=document.createElement('div');w.style.cssText='position:fixed;inset:0;z-index:60;background:#0B1218;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center';
 w.innerHTML=`<div class="lab" style="color:var(--glace)">SYSTÈME ${esc(gameName(mine.game).toUpperCase())}</div><h2 style="margin:0">CHARGEMENT…</h2><div id="gfHelp" style="display:none;flex-direction:column;gap:10px;width:100%;max-width:320px"><p style="margin:0">Le système ne répond pas.</p>${bigBtn('gfRetry','RÉESSAYER')}<button class="ghost" id="gfCancel">RETOUR À LA STATION</button></div>`;
 const f=document.createElement('iframe');f.title=gameName(mine.game);f.allow='autoplay';
 f.style.cssText='position:absolute;inset:0;width:100%;height:100%;border:0;background:#0B1218;opacity:0;transition:opacity .2s';
 const load=()=>{f.style.opacity='0';f.src='jeux.html?g='+gameKey(mine.game)+'&t='+Date.now()};
 w.appendChild(f);document.body.appendChild(w);gameFrame=w;load();
 let tmo=setTimeout(()=>{const h=w.querySelector('#gfHelp');if(h)h.style.display='flex'},8000);
 w.querySelector('#gfRetry').onclick=()=>{w.querySelector('#gfHelp').style.display='none';load();clearTimeout(tmo);tmo=setTimeout(()=>{w.querySelector('#gfHelp').style.display='flex'},8000)};
 w.querySelector('#gfCancel').onclick=()=>{clearTimeout(tmo);closeGame();render()};
 gameMsg=async e=>{if(e.source!==f.contentWindow||!e.data)return;
  if(e.data.uu==='ready'){clearTimeout(tmo);f.style.opacity='1';return}
  if(e.data.uu!=='result')return;clearTimeout(tmo);const win=!!e.data.win;closeGame();
  if(meta.state!=='game'){render();return}
  if(win){await R('stations/'+uid+'/endAt').set(now()+maxMs())}
  else{vib([80,40,80]);await R('stations/'+uid+'/frozenUntil').set(now()+C().gel*1000);
   const ids=Object.keys(stations);const v=ids[Math.floor(Math.random()*ids.length)];
   await R('stations/'+v+'/endAt').transaction(x=>x==null?x:x-C().penalite*1000);await R('stations/'+v+'/hitAt').set(now())}
  render()};
 window.addEventListener('message',gameMsg);
}

boot();
})();

</script>
