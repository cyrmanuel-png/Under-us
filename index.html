<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1218">
<title>Under Us</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allerta+Stencil&family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&family=Share+Tech+Mono&display=swap">
<style>
:root{--encre:#05080B;--acier-c:#4C5862;--acier-l:#8A949C;--glace:#9CD8EE;--glace-s:#2A4757;--orange:#FF6A1A;--orange-c:#FFB07E;--orange-f:#B84A10;--rouge:#E0302A;--vert:#4BE38A;--lueur:#C98BFF;--txt:#E3F1F7;--txt-2:#86AEC1;
--f-titre:'Barlow Condensed',Impact,'Arial Narrow',sans-serif;--f-label:'Allerta Stencil','Arial Black',sans-serif;--f-corps:'Barlow','Segoe UI',system-ui,sans-serif;--f-chiffre:'Share Tech Mono',ui-monospace,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:repeating-linear-gradient(90deg,#2E373E 0 3px,#4A555E 3px 7px,#6E7A84 7px 9px,#3E4952 9px 13px,#2E373E 13px 16px);color:var(--txt);font-family:var(--f-corps)}
body{padding:max(10px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto}
.frame{position:relative;height:100%;border:2px solid var(--encre);background:#141B20;box-shadow:inset 0 4px 0 rgba(0,0,0,.5);display:flex;flex-direction:column;gap:9px;padding:10px 9px;overflow-y:auto}
.dep{position:relative}
.dep::before{content:"";position:absolute;inset:0;transform:translate(3px,4px);background:var(--encre);clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.plate{position:relative;background:var(--encre);padding:2px;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.plate>.in{background:var(--glace-s);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);box-shadow:inset 0 3px 0 #A9CAD8,inset -2px -3px 0 rgba(0,0,0,.4);padding:9px 10px}
.head .in{background:var(--orange);box-shadow:inset 2px 2px 0 var(--orange-c),inset -3px -4px 0 var(--orange-f);display:flex;justify-content:space-between;align-items:center;padding:7px 10px}
.brand{font-family:var(--f-titre);font-weight:600;font-size:21px;letter-spacing:2.5px;color:var(--encre);line-height:1}
.lab{font-family:var(--f-label);font-size:11px;letter-spacing:.6px}.mute{color:var(--txt-2)}
.small{font-size:12.5px;color:var(--txt-2);line-height:1.45;margin:0}
.tag{font-family:var(--f-label);font-size:12px;letter-spacing:1px;color:var(--lueur);text-align:center}
.big{width:100%;border:0;background:none;padding:0;text-align:center;flex:none}
.big .in{background:var(--orange);color:var(--encre);font-family:var(--f-titre);font-weight:600;font-size:20px;letter-spacing:2px;padding:12px;box-shadow:inset 2px 2px 0 var(--orange-c),inset -3px -4px 0 var(--orange-f)}
.big.alt .in{background:var(--acier-c);color:var(--txt);box-shadow:inset 2px 2px 0 var(--acier-l),inset -3px -4px 0 #151C21}
.big.red .in{background:var(--rouge);color:#FCE3E1;box-shadow:inset 2px 2px 0 #FF8A84,inset -3px -4px 0 #7A1210}
.big:disabled .in{background:#3A4249;color:#6E7A84;box-shadow:inset 2px 2px 0 #4C5862}
.big:not(:disabled):active .plate{transform:translate(2px,3px)}
.sizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.sz{border:0;background:none;padding:0;text-align:center}.sz .in{display:flex;flex-direction:column;gap:3px;padding:10px 4px}
.sz b{font-family:var(--f-titre);font-weight:600;font-size:17px;letter-spacing:1.5px}.sz span{font-size:11px;color:var(--txt-2)}
.sz.on .in{background:var(--glace);color:var(--encre)}.sz.on span{color:#1E3A48}
.join{display:flex;gap:8px}.join .big{width:auto}
input{width:100%;min-width:0;background:var(--encre);border:2px solid #000;box-shadow:inset 0 0 0 1.5px #3E6378;color:var(--txt);padding:8px 10px;font-family:var(--f-corps);font-size:17px}
#jc{font-family:var(--f-chiffre);font-size:22px;letter-spacing:6px;text-transform:uppercase}
input.err{box-shadow:inset 0 0 0 2px var(--rouge)}
.txt#nm{font-family:var(--f-titre);font-weight:600;font-size:22px;letter-spacing:2px;text-transform:uppercase}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.col{width:40px;height:40px;border:2px solid var(--encre);border-radius:50%;padding:0;box-shadow:inset 3px 3px 0 rgba(255,255,255,.35)}
.col.on{outline:3px solid var(--orange);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1.5px solid var(--encre);background:#1C252C;color:var(--txt);font-size:13px;padding:7px 11px;border-radius:16px;box-shadow:1.5px 2px 0 var(--encre)}
.chk{margin:0;padding-left:18px;font-size:13px;color:var(--txt-2);line-height:1.6}
.msg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.msg h2{margin:0;font-family:var(--f-titre);font-weight:600;font-size:32px;letter-spacing:2.5px}
.msg p{margin:0;font-size:14px;color:var(--txt-2);max-width:30ch;line-height:1.45}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid #2A4757;border-top-color:var(--glace);animation:spn 1s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
.qrbox{display:flex;gap:10px;align-items:center}
.qr{flex:none;width:132px;height:132px;background:#EEF6FA;border:2px solid var(--encre);padding:6px;box-shadow:3px 4px 0 var(--encre)}
.qr img,.qr canvas{width:100%!important;height:100%!important;display:block}
.code{display:flex;flex-direction:column;gap:4px;min-width:0}
.code .dg{font-family:var(--f-chiffre);font-size:40px;letter-spacing:5px;background:var(--encre);color:var(--glace);padding:2px 8px;text-shadow:0 0 10px rgba(156,216,238,.55)}
.code p{margin:0;font-size:12px;color:var(--txt-2);line-height:1.35}
.counts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.cnt{background:var(--encre);text-align:center;padding:4px;box-shadow:inset -1px -1px 0 #3E6378}
.cnt b{display:block;font-family:var(--f-chiffre);font-size:26px;color:var(--glace)}.cnt span{font-family:var(--f-label);font-size:9px;color:var(--txt-2)}
.plist{flex:1;min-height:60px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.pl{display:flex;align-items:center;gap:9px;background:#1C252C;border:1.5px solid var(--encre);padding:7px 9px}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--encre);flex:none}
.pl .nm{flex:1;min-width:0}.pl .nm b{display:block;font-family:var(--f-titre);font-weight:600;font-size:17px;letter-spacing:1px}.pl .nm span{display:block;font-size:12px;color:var(--txt-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.led{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--encre);background:#2A353D;flex:none}
.led.ok{background:var(--vert);box-shadow:0 0 6px var(--vert)}.led.wait{background:#F2B21E;animation:bl .8s steps(1) infinite}.led.off{background:var(--rouge)}
@keyframes bl{50%{opacity:.25}}
.hubtop{display:flex;gap:6px}.hubtop .dep{flex:1}
.hb{width:44px;border:1.5px solid var(--encre);background:var(--acier-c);font-family:var(--f-titre);font-weight:600;font-size:20px;box-shadow:inset 1.5px 1.5px 0 var(--acier-l),2px 2px 0 var(--encre)}
.urg{background:#2A1A08;border:1.5px solid var(--orange);padding:6px 9px;font-size:13px;color:#FFD0B0}.urg b{color:#FFE0C8}
.sg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-content:start}
.st .in{position:relative;overflow:hidden;padding:7px 8px 8px}
.st .r1{display:flex;justify-content:space-between}.st .t{font-family:var(--f-label);font-size:12px}.st .no{font-family:var(--f-label);font-size:10px;color:#5E8296}
.st .loc{font-size:11.5px;color:var(--txt-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 5px}
.seg{position:relative;background:var(--encre);padding:3px 7px;font-family:var(--f-chiffre);font-size:30px;line-height:1;text-align:center;letter-spacing:2px}
.seg .gh{position:absolute;inset:3px 7px;color:#0F2430}.seg .v{position:relative;color:#8FE0FF;text-shadow:0 0 8px rgba(143,224,255,.6)}
.st .bar{height:6px;background:#030506;margin-top:6px}.st .bar>div{height:100%;background:#8FCBE2}
.st.warn .seg .v{color:#FF9A4A}.st.warn .bar>div{background:var(--orange)}
.st.crit .in{background:#4A1410}.st.crit .seg .v{color:#FF3B30;animation:bl .9s steps(1) infinite}.st.crit .bar>div{background:var(--rouge)}
.st .ice{position:absolute;inset:0;background:rgba(200,224,234,.96);color:var(--encre);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--f-label)}
.st .ice.off{background:rgba(74,20,16,.95);color:#FFB0A8}
.meet{border:0;background:none;padding:0;width:100%;margin-top:auto}
.meet .in{background:repeating-linear-gradient(-45deg,#FF6A1A 0 9px,#0A1218 9px 18px);padding:3px;box-shadow:none}
.meet .mi{padding:11px;background:#D7261E;text-align:center;font-family:var(--f-titre);font-weight:600;font-size:19px;letter-spacing:1.5px;color:#FCE3E1}
.ovl{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,8,11,.88)}
.ovl[hidden]{display:none!important}
.pan{width:100%;max-width:460px;background:#1C252C;border:2px solid var(--encre);box-shadow:inset 0 4px 0 #A9CAD8,5px 6px 0 var(--encre);padding:14px 12px;display:flex;flex-direction:column;gap:10px;text-align:center}
.pan.red{box-shadow:inset 0 4px 0 #FF8A84,5px 6px 0 var(--encre)}
.pan h3{margin:0;font-family:var(--f-titre);font-weight:600;font-size:30px;letter-spacing:2px}.pan p{margin:0;font-size:13.5px;color:var(--txt-2);line-height:1.45}
.sys{flex:1;min-height:240px;border:2px solid var(--encre);background:radial-gradient(ellipse at 50% 35%,#1E3A4A,#0E1A22 65%,#081016);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px}
.sys h2{margin:0;font-family:var(--f-titre);font-weight:600;font-size:38px;letter-spacing:3px}.sys p{margin:0;font-size:14px;color:var(--txt-2);max-width:28ch;line-height:1.45}
.sys.alarm{animation:alarm 1s steps(1) infinite;background:#3A0C08}.sys.alarm p,.sys.alarm .lab{color:#FFD0C8}
@keyframes alarm{50%{background:#7A1A12}}
.sys.frozen{background:radial-gradient(ellipse at 50% 40%,#DCEBF1,#9FBFCC 60%,#6E8FA0)}.sys.frozen h2,.sys.frozen .lab{color:var(--encre)}.sys.frozen p{color:#1E3A48}
.sys.paused{background:repeating-linear-gradient(-45deg,#1C252C 0 14px,#151C21 14px 28px)}
.big7{font-family:var(--f-chiffre);font-size:56px;background:var(--encre);color:var(--glace);padding:4px 14px}
.ghost{border:1.5px solid var(--encre);background:#3A1410;color:#FFB0A8;font-family:var(--f-label);font-size:11px;padding:11px;box-shadow:2px 2px 0 var(--encre)}
.mg{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;align-items:center}
.gauge{position:relative;width:100%;height:70px;background:var(--encre);border:2px solid #000;box-shadow:inset -1px -1px 0 #3E6378}
.gauge .zone{position:absolute;top:0;bottom:0;background:var(--vert);opacity:.85}
.gauge .needle{position:absolute;top:-10px;bottom:-10px;width:6px;margin-left:-3px;background:var(--orange);border:1.5px solid var(--encre)}
.pips{display:flex;gap:6px;align-items:center;font-family:var(--f-label);font-size:10px;color:var(--txt-2)}
.pips i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--encre);background:#2A353D}.pips i.ok{background:var(--vert)}.pips i.ko{background:var(--rouge)}
.tb{width:100%;height:7px;background:#030506}.tb>div{height:100%;background:var(--glace)}
.row2{display:flex;gap:8px}
.mono{font-family:var(--f-chiffre)}
.setpan{text-align:left;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);padding:12px 12px 10px;gap:7px}
.setpan h3{font-size:22px;letter-spacing:1.5px}.setpan>p{font-size:12px}
.setbody{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
.sgrp{color:var(--glace);margin:8px 0 2px;font-size:10px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 0;border-bottom:1px solid #2E3A42;font-size:13px;line-height:1.2;color:#C4DEE9}
.srow input{width:58px;flex:none;padding:3px 6px;height:30px;font-size:16px;text-align:right;font-family:var(--f-chiffre)}
.setpan .row2{flex:none}.setpan .row2 .big{flex:1 1 0;width:auto;min-width:0}.setpan .big .in{padding:9px 6px;font-size:15px;letter-spacing:1px}
.srow input:disabled{opacity:.6}
.u{font-style:normal;font-family:var(--f-label);font-size:10px;color:var(--txt-2);min-width:24px}
.hubtop .hb{flex:none}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* v0.3 : rôles, vote, quarantaine */
.row2 .big{flex:1 1 0;width:auto;min-width:0}
.row2 .big .in{font-size:17px;padding:11px 6px}
.hrow{display:flex;align-items:center;gap:8px;background:var(--encre);padding:5px 8px;box-shadow:inset -1px -1px 0 #3E6378}
.hb.sm{width:36px;height:32px;font-size:20px;line-height:1;padding:0}
.hrow b{font-size:24px;color:var(--lueur);min-width:22px;text-align:center}.hrow .small{margin-left:auto;text-align:right}

.avat.big{width:84px;height:84px}
.role{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:18px;border:2px solid var(--encre)}
.role h2{margin:0;font-family:var(--f-titre);font-weight:600;font-size:46px;letter-spacing:3px}
.role p{margin:0;font-size:14.5px;line-height:1.5;max-width:32ch}

.cm{position:relative;display:flex;align-items:center;gap:4px;font-family:var(--f-titre);font-weight:600;font-size:13px;letter-spacing:.5px;color:var(--txt)}

.botrow{display:flex;gap:8px;margin-top:auto;align-items:stretch}.botrow .meet{margin-top:0;flex:1}.botrow .ghost{flex:none;width:86px;font-size:12px}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;max-height:46vh;overflow-y:auto}

.win{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:18px 12px;border:2px solid var(--encre)}

.win.ch{background:radial-gradient(ellipse at 50% 30%,#2C5A70,#0E1A22 75%)}.win.ch h2{color:var(--glace)}.win.ch .lab,.win.ch p{color:#C8E4F0}
.win.ho{background:radial-gradient(ellipse at 50% 30%,#4B137F,#22073D 75%)}.win.ho h2{color:#F0DEFF;text-shadow:0 0 14px #C98BFF}.win.ho .lab,.win.ho p{color:#E2C8FF}
.qpan h3{font-size:28px}

<script>
/* ===== Moteur son Under Us (identique au banc son) ===== */
(function(){
let AC=null,MASTER=null,COMP=null,NOISE=null,AN=null;
function ctx(){
 if(AC)return AC;
 AC=new (window.AudioContext||window.webkitAudioContext)();
 COMP=AC.createDynamicsCompressor();COMP.threshold.value=-14;COMP.ratio.value=4;COMP.connect(AC.destination);
 MASTER=AC.createGain();MASTER.gain.value=.8;MASTER.connect(COMP);
 AN=AC.createAnalyser();AN.fftSize=256;MASTER.connect(AN);
 const len=AC.sampleRate*2,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;NOISE=b;
 return AC}
const now=()=>AC.currentTime;
/* briques */
function env(g,t,a,peak,dec,sus=0){g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(Math.max(sus,0.0001),t+a+dec)}
function osc(type,f,t,dur,peak,dest,{a=.005,detune=0}={}){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.detune.value=detune;env(g,t,a,peak,dur);o.connect(g);g.connect(dest||MASTER);o.start(t);o.stop(t+a+dur+.05);return o}
function noise(t,dur,peak,{type='bandpass',f=1000,q=1,dest,a=.005}={}){const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NOISE;s.loop=true;fl.type=type;fl.frequency.setValueAtTime(f,t);fl.Q.value=q;env(g,t,a,peak,dur);s.connect(fl);fl.connect(g);g.connect(dest||MASTER);s.start(t,Math.random()*1.5);s.stop(t+a+dur+.05);return {s,fl,g}}
function thump(t,f=70,peak=.9,dur=.35){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(f*2.2,t);o.frequency.exponentialRampToValueAtTime(f,t+.08);env(g,t,.004,peak,dur);o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+dur+.1)}
const N=n=>440*Math.pow(2,(n-69)/12);
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* ===== BOUCLES ===== */
const LOOPS={};
function loopWind(){/* ambiance : glockenspiel lointain, petites notes rares et inquiétantes (gamme à triton), écho froid */
 const out=AC.createGain();out.gain.value=.0001;out.connect(MASTER);out.gain.exponentialRampToValueAtTime(.5,now()+1.5);
 const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=5200;lp.connect(out);
 const dl=AC.createDelay(2),fb=AC.createGain(),wet=AC.createGain();dl.delayTime.value=.62;fb.gain.value=.38;wet.gain.value=.35;lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(out);
 const scale=[74,75,78,81,82,86,87,90];/* ré, mib, fa#, la, sib… : mineur + triton */
 let alive=true,last=-1;
 const bell=(t,n,v)=>{[[1,1,1.9],[2.76,.32,.7],[5.4,.12,.35],[8.93,.05,.18]].forEach(([m,a,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=N(n)*m;o.detune.value=(Math.random()-.5)*8;env(g,t,.002,v*a,d);o.connect(g);g.connect(lp);o.start(t);o.stop(t+d+.1)})};
 const play=()=>{if(!alive)return;const t=now()+.05;let i;do{i=Math.floor(Math.random()*scale.length)}while(i===last);last=i;const n=scale[i],v=.05+Math.random()*.035;
  bell(t,n,v);const r=Math.random();
  if(r<.28)bell(t+.32+Math.random()*.25,n+1,v*.7);/* seconde mineure qui grince */
  else if(r<.42)bell(t+.45,n-6,v*.6);/* triton descendant */
  else if(r<.5){bell(t+.28,n,v*.55);bell(t+.56,n,v*.3)}/* note qui insiste */
  setTimeout(play,2600+Math.random()*4800)};
 setTimeout(play,900);
 return ()=>{alive=false;const t=now();out.gain.cancelScheduledValues(t);out.gain.setValueAtTime(Math.max(out.gain.value,.0001),t);out.gain.exponentialRampToValueAtTime(.0001,t+1.5);setTimeout(()=>{try{out.disconnect()}catch(e){}},2500)}}
function loopMusic(){/* tension : ostinato grave à 92 bpm, nappe mineure, battement de cœur, cloche de glace */
 const out=AC.createGain();out.gain.value=.0001;out.connect(MASTER);out.gain.exponentialRampToValueAtTime(.7,now()+1.5);
 const bpm=92,beat=60/bpm,bass=[38,38,41,38,36,38,43,41],pad=[[50,53,57],[48,52,55],[46,50,53],[45,48,52]];
 let step=0,nextT=now()+.1,alive=true;
 const padBus=AC.createBiquadFilter();padBus.type='lowpass';padBus.frequency.value=900;padBus.connect(out);
 const sched=()=>{if(!alive)return;while(nextT<now()+.3){const t=nextT,s=step;
   /* basse en croches */
   const f=N(bass[Math.floor(s/2)%8]);const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=f;fl.type='lowpass';fl.frequency.setValueAtTime(700,t);fl.frequency.exponentialRampToValueAtTime(160,t+beat*.45);env(g,t,.005,.22,beat*.45);o.connect(fl);fl.connect(g);g.connect(out);o.start(t);o.stop(t+beat*.5);
   /* nappe toutes les 2 mesures */
   if(s%16===0){const ch=pad[(s/16)%4];ch.forEach((n,k)=>{[-6,6].forEach(dt=>{const p=AC.createOscillator(),pg=AC.createGain();p.type='sawtooth';p.frequency.value=N(n);p.detune.value=dt;pg.gain.setValueAtTime(.0001,t);pg.gain.exponentialRampToValueAtTime(.035,t+1.2);pg.gain.setValueAtTime(.035,t+beat*7);pg.gain.exponentialRampToValueAtTime(.0001,t+beat*8.2);p.connect(pg);pg.connect(padBus);p.start(t);p.stop(t+beat*8.4)})})}
   /* cœur : boum-boum sur les temps 1 */
   if(s%8===0){const kt=t;[[0,.55],[.18,.35]].forEach(([d,v])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(110,kt+d);o.frequency.exponentialRampToValueAtTime(46,kt+d+.1);env(g,kt+d,.004,v,.22);o.connect(g);g.connect(out);o.start(kt+d);o.stop(kt+d+.3)})}
   /* cloche de glace de temps en temps */
   if(s%32===14){[1,2.76,5.4].forEach((m,k)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=N(86)*m/2;env(g,t,.002,.06/(k+1),2.2);o.connect(g);g.connect(out);o.start(t);o.stop(t+2.4)})}
   step++;nextT+=beat/2}
  setTimeout(sched,60)};sched();
 return ()=>{alive=false;const t=now();out.gain.cancelScheduledValues(t);out.gain.setValueAtTime(Math.max(out.gain.value,.0001),t);out.gain.exponentialRampToValueAtTime(.0001,t+1)}}
function loopAlarm(){/* réunion : deux tons carrés + vibration, comme sur les stations */
 let alive=true,k=0;const tick=()=>{if(!alive)return;const t=now();const f=k%2?660:880;osc('square',f,t,.22,.14);osc('square',f*1.003,t,.22,.08);if(k%4===0)buzz(200);k++;setTimeout(tick,300)};tick();
 return ()=>{alive=false}}
function loopCritical(){/* compteur critique sur le hub : tic aigu qui accélère légèrement */
 let alive=true,iv=1;const tick=()=>{if(!alive)return;const t=now();osc('square',1760,t,.03,.09);osc('sine',880,t,.06,.05);iv=Math.max(.35,iv*.97);setTimeout(tick,iv*1000)};tick();return ()=>{alive=false}}

/* ===== SONS PONCTUELS ===== */
const ONE={
 tap(){const t=now();osc('square',620,t,.03,.08)},
 stationBip(){const t=now();osc('sine',1200,t,.07,.25);osc('sine',1200,t+.12,.07,.25)},
 success(){const t=now();[72,76,79,84].forEach((n,i)=>{osc('triangle',N(n),t+i*.07,.25,.28);osc('sine',N(n+12),t+i*.07,.2,.06)});buzz(60)},
 fail(){const t=now();const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(320,t);o.frequency.exponentialRampToValueAtTime(70,t+.6);env(g,t,.01,.25,.6);const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=1400;o.connect(f);f.connect(g);g.connect(MASTER);o.start(t);o.stop(t+.7);
  for(let i=0;i<9;i++)noise(t+.25+i*.05+Math.random()*.03,.05,.18,{type:'highpass',f:5000+Math.random()*3000,q:2});thump(t+.2,55,.6);buzz([80,60,160])},
 unfreeze(){const t=now();noise(t,.5,.12,{type:'highpass',f:3000,q:.7,a:.2});[84,88,91].forEach((n,i)=>osc('sine',N(n),t+.3+i*.06,.4,.12))},
 penalty(){const t=now();osc('square',220,t,.12,.12);osc('square',185,t+.14,.25,.12)},
 repaired(){const t=now();osc('sine',N(83),t,.1,.15);osc('sine',N(90),t+.08,.25,.15)},
 fuse(){const t=now();noise(t,.12,.6,{type:'bandpass',f:2400,q:.8});for(let i=0;i<6;i++)noise(t+.05+Math.random()*.35,.03,.25,{type:'highpass',f:4000,q:1});thump(t,90,.5,.2);noise(t+.1,.6,.08,{type:'lowpass',f:700,q:.5,a:.1})},
 wake(){const t=now();[60,67,72,79].forEach((n,i)=>osc('triangle',N(n),t+i*.12,.5,.15));buzz([100,60,100])},
 meetCall(){const t=now();[0,.16,.32].forEach((d,i)=>osc('square',i%2?660:880,t+d,.12,.18));thump(t,60,.7);buzz([200,100,200])},
 body(){const t=now();[[36,0],[37,0],[43,0]].forEach(([n])=>{osc('sawtooth',N(n),t,.9,.12);});noise(t,.9,.25,{type:'bandpass',f:3200,q:6,a:.02});const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(N(84),t);o.frequency.exponentialRampToValueAtTime(N(96),t+.7);env(g,t,.02,.06,.7);o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+.8);thump(t,45,1,.6);buzz([300])},
 present(){const t=now();osc('sine',760,t,.06,.18)},
 debateTick(){const t=now();osc('square',1200,t,.04,.12)},
 voteOk(){const t=now();osc('triangle',N(76),t,.12,.2);osc('triangle',N(83),t+.09,.2,.2)},
 voteLate(){const t=now();osc('sawtooth',160,t,.3,.18)},
 tally(){const t=now();for(let i=0;i<6;i++)osc('square',N(60+i*2),t+i*.09,.06,.06);thump(t+.6,70,.5)},
 chef(){const t=now();[67,72,76].forEach((n,i)=>{osc('sawtooth',N(n),t+i*.02,.9,.07);});thump(t,80,.4)},
 reveal(){/* identique pour chercheur et hôte */const t=now();[1,2.01,3.02].forEach((m,k)=>osc('sine',520*m,t,1.1/(k+1),.18/(k+1)));buzz(80)},
 countdown(){const t=now();[0,.8,1.6].forEach(d=>osc('square',440,t+d,.1,.15));osc('triangle',880,t+2.4,.6,.25);osc('triangle',1320,t+2.4,.6,.12);thump(t+2.4,60,.8)},
 quarantine(){const t=now();/* sas : chuintement, porte qui s'ouvre, blizzard, porte qui claque, rôle */
  noise(t,.6,.25,{type:'highpass',f:1500,q:.5,a:.05});thump(t+.7,48,.8,.5);
  const w=noise(t+.8,3,.45,{type:'bandpass',f:500,q:.6,a:.6});w.fl.frequency.linearRampToValueAtTime(1400,t+2.6);
  for(let i=0;i<5;i++)noise(t+1+i*.5,.25,.06,{type:'bandpass',f:180,q:3});
  thump(t+4.6,40,1,.7);noise(t+4.6,.3,.3,{type:'lowpass',f:500,q:.6});
  for(let i=0;i<10;i++)noise(t+4.75+i*.04,.04,.12,{type:'highpass',f:6000,q:2});buzz([0,4600,200])},
 roleCh(){const t=now();[60,64,67,72].forEach((n,i)=>osc('triangle',N(n),t+i*.05,1.2,.12))},
 roleHo(){const t=now();[48,49,55,61].forEach(n=>osc('sawtooth',N(n),t,1.4,.07));const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(N(96),t);o.frequency.linearRampToValueAtTime(N(91),t+1.4);env(g,t,.3,.05,1.2);o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+1.6);thump(t,38,.9,.8)},
 winCh(){const t=now();const ch=[[60,64,67],[65,69,72],[67,71,74],[72,76,79,84]];ch.forEach((c,i)=>c.forEach(n=>{osc('sawtooth',N(n),t+i*.45,i===3?2.2:.5,.06,null,{a:.04});osc('triangle',N(n),t+i*.45,i===3?2.2:.5,.08,null,{a:.02})}));thump(t+1.35,70,.6)},
 winHo(){const t=now();[36,37,42,43].forEach(n=>osc('sawtooth',N(n),t,3,.08,null,{a:.4}));for(let i=0;i<8;i++)osc('sine',N(88+Math.floor(Math.random()*8)),t+.4+i*.3,.6,.04);const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(55,t);o.frequency.linearRampToValueAtTime(41,t+3);const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=260;env(g,t,.8,.25,2.4);o.connect(f);f.connect(g);g.connect(MASTER);o.start(t);o.stop(t+3.4);thump(t,32,1,1.2)}
};


const LOOPFN={wind:loopWind,music:loopMusic,alarm:loopAlarm,crit:loopCritical};const MUS={wind:1,music:1};
let fxOn=true,musOn=true;
function ready(){ctx();if(AC.state==='suspended')AC.resume()}
window.SND={
 play(k){if(!fxOn||!ONE[k])return;try{ready();ONE[k]()}catch(e){}},
 loop(k,on){if((MUS[k]&&!musOn)||(!MUS[k]&&!fxOn)){on=false}try{if(on&&!LOOPS[k]){ready();LOOPS[k]=LOOPFN[k]()}else if(!on&&LOOPS[k]){LOOPS[k]();delete LOOPS[k]}}catch(e){}},
 stopAll(){for(const k in LOOPS){try{LOOPS[k]()}catch(e){}delete LOOPS[k]}},
 setFx(v){fxOn=v;if(!v)['alarm','crit'].forEach(k=>this.loop(k,false))},
 setMus(v){musOn=v;if(!v)['wind','music'].forEach(k=>this.loop(k,false))},
 get musOn(){return musOn}};
})();
</script>

 ['Stations',[['stMin','Stations minimum',''],['stMax','Stations maximum',''],['partie','Durée visée','min']]],
 ['Compteurs',[['plafond','Plafond d’un système','min'],['departMin','Départ le plus bas','%'],['departMax','Départ le plus haut','%'],['parStation','Bonus par station en plus','s']]],

const alive=()=>crew().filter(([,p])=>!p.out);

function plate(inner,cls=''){return `<div class="dep ${cls}"><div class="plate"><div class="in">${inner}</div></div></div>`}
function bigBtn(id,label,cls=''){return `<button class="big ${cls}" id="${id}">${plate(label)}</button>`}

/* anti-veille : Wake Lock quand le navigateur le permet, + vidéo muette en boucle (indispensable sur iPhone) */

/* ===== Démarrage ===== */
async function boot(){
 screen(header('UNDER US')+`<div class="msg"><div class="spin"></div><p>Connexion à la station…</p></div>`);
 try{
  firebase.initializeApp(firebaseConfig);db=firebase.database();
  const cred=await firebase.auth().signInAnonymously();uid=cred.user.uid;
  db.ref('.info/serverTimeOffset').on('value',s=>offset=s.val()||0);
 }catch(e){fatal('Impossible de joindre Firebase ('+(e.code||e.message)+'). Vérifie la connexion 4G/5G.');return}
 const q=new URLSearchParams(location.search);const r=(q.get('r')||'').toUpperCase(),h=(q.get('hub')||'').toUpperCase();
 if(h){const m=(await db.ref('rooms/'+h+'/meta').get()).val();if(m&&m.hub===uid){code=h;role='hub';listenRoom();keepAwake();return}}
 if(r)joinRoom(r);else home();
}

/* ===== HUB ===== */
async function createRoom(){
 S('tap');const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c='';
 for(let k=0;k<6;k++){c=Array.from({length:4},()=>A[Math.floor(Math.random()*A.length)]).join('');const s=await db.ref('rooms/'+c+'/meta').get();if(!s.exists())break}
 code=c;role='hub';
 await R('meta').set({hub:uid,size,cfg:presetFor(size),state:'lobby',created:firebase.database.ServerValue.TIMESTAMP});
 history.replaceState(null,'','?hub='+code);
 listenRoom();hubLobby();keepAwake();
}
function listenRoom(){
 R('meta').on('value',s=>{meta=s.val()||{};render()});
 R('players').on('value',s=>{players=s.val()||{};if(role==='hub')autoPause();render()});
 R('stations').on('value',s=>{stations=s.val()||{};render()});
 if(role==='hub')R('roles').on('value',s=>{roles=s.val()||{};render()});
 if(timer)clearInterval(timer);timer=setInterval(render,250);
}
function joinUrl(){return location.origin+location.pathname+'?r='+code}
function render(){if(role==='hub')hubRender();else if(role==='station')stRender()}

function hubRender(){
 const st=meta.state;
 const key=st==='reveal'?'reveal-'+(meta.revealIdx||0):st;
 if(key!==lastState){const prev=lastState;lastState=key;
  if(st==='lobby'){if(!$('#qr'))return hubLobby()}
  if(st==='reveal')return hubReveal(prev);
  if(st==='game'||st==='meeting'||st==='paused'){if(!$('#hgrid'))hubGame();onHubState(st,prev)}
  if(st==='over')return hubOver();
 }
 if(st==='lobby'){
  if(!$('#plist'))return;
  const list=Object.entries(players);const ready=list.filter(([,p])=>p.ready&&!p.nophone);const total=crew().length,nh=nHosts();
  $('#cJ').textContent=total;$('#cR').textContent=ready.length;$('#hN').textContent=nh;
  $('#hInfo').textContent=total?`${total-nh} chercheur${total-nh>1?'s':''} · ${nh} hôte${nh>1?'s':''}`:'';
  const html=list.map(([id,p])=>`<div class="pl"><span class="dot" style="background:${esc(p.color||'#8A949C')}"></span><div class="nm"><b>${esc((p.name||'…').toUpperCase())}</b><span>${p.nophone?'Sans station · rôle vu sur le hub':p.ready?esc(p.loc||''):'Prépare sa station…'}</span></div>${p.nophone?`<button class="del" data-del="${esc(id)}" aria-label="Retirer ${esc(p.name)}">✕</button>`:`<span class="led ${p.online===false?'off':p.ready?'ok':'wait'}"></span>`}</div>`).join('')||'<p class="small">Personne pour l’instant.</p>';
  if(html!==lobbyHtml){lobbyHtml=html;$('#plist').innerHTML=html}
  const c=C(),b=$('#launch');const needP=2*nh+1;
  b.disabled=ready.length<c.stMin||total<needP;
  b.querySelector('.in').textContent=ready.length<c.stMin?`ENCORE ${c.stMin-ready.length} STATION${c.stMin-ready.length>1?'S':''} (MIN. ${c.stMin})`:total<needP?`IL FAUT ${needP} JOUEURS POUR ${nh} HÔTE${nh>1?'S':''}`:`LANCER · ${Math.min(ready.length,c.stMax)} SYSTÈMES · ${total} JOUEURS`;
 }
 if(st==='game'||st==='meeting'||st==='paused')hubTick();
}
async function launch(){
 const c=C();const st=Object.entries(players).filter(([,p])=>p.ready&&!p.nophone).slice(0,c.stMax);
 const all=crew().map(([id])=>id),nh=nHosts();if(st.length<c.stMin||all.length<2*nh+1)return;
 S('tap');const upd={};
 const games=shuffle(GAMES);
 st.forEach(([id,p],i)=>{upd['stations/'+id]={num:i+1,game:games[i%games.length],loc:p.loc||'',name:p.name||'',endAt:0,frozenUntil:0}});
 const mix=shuffle(all);const rl={};mix.forEach((id,i)=>rl[id]=i<nh?'h':'c');upd.roles=rl;
 all.forEach(id=>{upd['players/'+id+'/out']=null});
 Object.assign(upd,{'meta/state':'reveal','meta/revealOrder':shuffle(all),'meta/revealIdx':0,'meta/chef':all[Math.floor(Math.random()*all.length)],'meta/winner':null,'meta/victim':null,'meta/reason':null,'meta/pausedAt':null,'meta/nHostsUsed':nh,'meta/crew':Object.fromEntries(all.map(id=>[id,true]))});
 await R().update(upd);
}
/* ===== Révélation des rôles : le hub passe de main en main ===== */
function hubReveal(prev){
 L('music',false);L('wind',false);
 if(!Object.keys(players).length||!Object.keys(roles).length){lastState=null;screen(header('UNDER US')+'<div class="msg"><div class="spin"></div></div>');return}
 const order=(meta.revealOrder||[]).filter(id=>players[id]),i=meta.revealIdx||0;
 if(i>=order.length){
  if(prev&&prev.startsWith('reveal'))S('chef');
  screen(header('CHEF DE MISSION')+`<div class="msg"><span class="lab mute">TIRÉ AU SORT</span><div class="avat big" style="background:${esc((players[meta.chef]||{}).color||'#8A949C')}"></div><h2>${esc(pname(meta.chef))}</h2><p>Dirige la mission. En cas d’égalité au vote, c’est lui qui tranche, seul, parmi les ex æquo. Il peut être chercheur… ou hôte.</p><p class="small">Si le chef disparaît, un nouveau chef est tiré au sort parmi les vivants.</p></div>${bigBtn('goM','LANCER LA MISSION')}`);
  $('#goM').onclick=startMission;return}
 const id=order[i],p=players[id]||{};
 screen(header('RÉVÉLATION DES RÔLES',`${i+1} / ${order.length}`)+`<div class="msg"><span class="lab mute">PASSE LE HUB À</span><div class="avat big" style="background:${esc(p.color||'#8A949C')}"></div><h2>${esc(pname(id))}</h2><p>Les autres détournent les yeux. Seul ${esc(p.name||'')} regarde l’écran.</p></div>${bigBtn('see','JE SUIS '+esc(pname(id))+' · VOIR MON RÔLE')}`);
 $('#see').onclick=()=>{S('reveal');vib([60,40,60]);
  const h=roles[id]==='h';const mates=h?Object.keys(roles).filter(x=>x!==id&&roles[x]==='h').map(pname):[];
  screen(header('TON RÔLE',esc(pname(id)))+(h?`<div class="role ho"><span class="lab">TU ES</span><h2>HÔTE</h2><p>Le parasite vit en toi. Sabote les systèmes (rate les réparations exprès), élimine les chercheurs sans te faire repérer. Pour tuer : main sur l’épaule, la victime s’assoit et se tait.</p><p class="mates">${mates.length?'Les autres hôtes : <b>'+mates.map(esc).join(', ')+'</b>':'Tu es le seul hôte.'}</p></div>`:`<div class="role ch"><span class="lab">TU ES</span><h2>CHERCHEUR</h2><p>Garde les systèmes vitaux en marche en réussissant les réparations. Repère les hôtes et envoie-les en quarantaine lors des votes.</p><p class="mates">Les chercheurs gagnent quand tous les hôtes sont en quarantaine.</p></div>`)+bigBtn('hide','J’AI VU · CACHER ET PASSER'));
  $('#hide').onclick=()=>{S('tap');screen(header('RÉVÉLATION DES RÔLES')+`<div class="msg"><div class="spin"></div></div>`);R('meta/revealIdx').set(i+1)}};
}
async function startMission(){
 S('countdown');const c=C(),t0=now()+3500,ids=Object.keys(stations),max=maxMs(ids.length);const upd={};
 ids.forEach(id=>{upd['stations/'+id+'/endAt']=t0+Math.round(max*(c.departMin+Math.random()*Math.max(0,c.departMax-c.departMin))/100)});
 Object.assign(upd,{'meta/state':'game','meta/startAt':t0,'meta/coolUntil':t0,'meta/reason':null,'meta/pausedAt':null,'meta/revealOrder':null});
 await R().update(upd);
}
function hubGame(){
 screen(`<div class="hubtop">${header('UNDER US','<span id="hClock">00:00</span>')}<button class="hb" id="hSet" aria-label="Réglages">⚙</button><button class="hb" id="hPause" aria-label="Pause">II</button></div>

let crewHtml='';
function remaining(s){const ref=(meta.state==='game')?now():(meta.pausedAt||now());return (s.endAt||0)-ref}
function hubTick(){
 const g=$('#hgrid');if(!g)return;
 const list=Object.entries(stations).sort((a,b)=>a[1].num-b[1].num);const max=maxMs();
 {const left=(meta.coolUntil||0)-now(),mb=$('#hMeet'),mt=$('#hMeetT');if(mb&&mt&&meta.state==='game'){mb.disabled=left>0;mb.style.opacity=left>0?.55:1;mt.textContent=left>0?'RÉUNION D’URGENCE · '+fmt(left):'RÉUNION D’URGENCE'}}
 {const a=alive().length,t=crew().length;const h=`<span class="lab mute">VIVANTS ${a}/${t}</span>`+crewBand(false);if(h!==crewHtml){crewHtml=h;$('#hCrew').innerHTML=h}}
 const ref=meta.state==='game'?now():(meta.pausedAt||now());
 if(meta.startAt)$('#hClock').textContent=fmt(Math.max(0,ref-meta.startAt));
 g.innerHTML=list.map(([id,s])=>{const r=s.endAt-ref,ratio=r/max,fz=(s.frozenUntil||0)>ref;const off=players[id]&&players[id].online===false;const cls=fz?'':ratio<.12?'crit':ratio<.4?'warn':'';
  return `<div class="st dep ${cls}"><div class="plate"><div class="in"><div class="r1"><span class="t">${esc(s.game)}</span><span class="no">${String(s.num).padStart(2,'0')}</span></div><div class="loc">${esc(s.loc)}</div><div class="seg"><span class="gh">88:88</span><span class="v">${fmt(r)}</span></div><div class="bar"><div style="width:${Math.max(2,Math.min(100,ratio*100))}%"></div></div>${fz?`<div class="ice"><b>GELÉE</b><span class="mono">${fmt(s.frozenUntil-ref)}</span></div>`:''}${off?'<div class="ice off"><b>HORS LIGNE</b></div>':''}</div></div></div>`}).join('');
 const live=list.filter(([,s])=>!((s.frozenUntil||0)>ref)).sort((a,b)=>a[1].endAt-b[1].endAt)[0];
 if(meta.state==='game'&&live)$('#hUrg').innerHTML=`Le plus urgent : <b>${esc(live[1].game)} ${String(live[1].num).padStart(2,'0')}</b> · ${esc(live[1].loc)} · ${fmt(live[1].endAt-ref)}`;
 L('crit',meta.state==='game'&&list.some(([,s])=>(s.endAt-ref)/max<.12));
 if(meta.state==='game'&&list.some(([,s])=>s.endAt>0&&s.endAt-ref<=0)){const dead=list.find(([,s])=>s.endAt>0&&s.endAt-ref<=0)[1];setOver('h',`${gameName(dead.game)} (${dead.game} ${String(dead.num).padStart(2,'0')}) est tombé à zéro`)}
}

async function checkWin(){

 if(h===0){await setOver('c','Tous les hôtes sont en quarantaine');return true}

 return false}

  if(win){await R('stations/'+uid+'/endAt').set(now()+maxMs())}
  else{vib([80,40,80]);await R('stations/'+uid+'/frozenUntil').set(now()+C().gel*1000);
   const ids=Object.keys(stations);const v=ids[Math.floor(Math.random()*ids.length)];
   await R('stations/'+v+'/endAt').transaction(x=>x==null?x:x-C().penalite*1000)}
  render()};
 window.addEventListener('message',gameMsg);
}

boot();
})();
